system: SYS-03
defaults: {ind: [ALL], lvl: [process, equipment], status: expert_reviewed, reviewed_by: "CEP", reviewed_on: "2026-11-08"}
records:
- id: EQP-03-001
  fa: "اسمز معکوس آب لب‌شور (BWRO)"
  en: "Brackish water reverse osmosis (BWRO)"
  sub: reverse_osmosis
  role: [treatment]
  in: [fresh_water, raw_water, reclaimed_water]
  out: [ro_permeate, ro_concentrate]
  params: [flow_rate, pressure, diff_pressure, ec, tds, temperature, energy_consumption]
  note: "بازیابی برابر نسبت دبی پرمیت به خوراک است؛ افزایش بازیابی بدون بررسی رسوب‌گذاری ممنوع."
  ref: [M1-6.3, M2-4.6]
- id: EQP-03-002
  fa: "اسمز معکوس آب دریا (SWRO)"
  en: "Seawater reverse osmosis (SWRO)"
  sub: reverse_osmosis
  role: [treatment]
  in: [raw_water]
  out: [ro_permeate, ro_concentrate]
  params: [flow_rate, pressure, diff_pressure, ec, tds, temperature, energy_consumption]
  note: "بازیابی کمتر و فشار بالاتر از آب لب‌شور؛ دفع کنسانتره به مقصد مجاز باید ثبت شود."
  ref: [M1-6.3]
- id: EQP-03-003
  fa: "اولترافیلتراسیون (UF)"
  en: "Ultrafiltration (UF)"
  sub: ultrafiltration
  role: [treatment]
  in: [raw_water, fresh_water, reclaimed_water]
  out: [fresh_water, wastewater]
  params: [flow_rate, diff_pressure, turbidity, tss, volume]
  note: "پیش‌تصفیه RO یا پالایش پساب؛ شست‌وشوی معکوس بخشی از خوراک را به پساب می‌برد."
  ref: [M1-6.3]
- id: EQP-03-004
  fa: "میکروفیلتراسیون (MF)"
  en: "Microfiltration (MF)"
  sub: microfiltration
  role: [treatment]
  in: [raw_water, fresh_water, reclaimed_water]
  out: [fresh_water, wastewater]
  params: [flow_rate, diff_pressure, turbidity, tss, volume]
  note: "حذف ذرات و ریزمعلق‌ها؛ حجم شست‌وشوی معکوس در موازنه ثبت شود."
  ref: [M1-6.3]
- id: EQP-03-005
  fa: "نانوفیلتراسیون (NF)"
  en: "Nanofiltration (NF)"
  sub: nanofiltration
  role: [treatment]
  in: [fresh_water, raw_water, reclaimed_water]
  out: [ro_permeate, ro_concentrate]
  params: [flow_rate, pressure, diff_pressure, ec, hardness, sulfate, temperature]
  note: "حذف سختی و سولفات؛ جریان‌های محصول و تغلیظ‌شده تا تعریف نوع جدید با انواع RO ثبت می‌شوند."
  ref: [M1-6.3]
- id: EQP-03-006
  fa: "فیلتر چندلایه (شنی و ضدتوده)"
  en: "Multimedia / sand pretreatment filter"
  sub: media_filter
  role: [treatment]
  in: [raw_water, fresh_water]
  out: [fresh_water, wastewater]
  params: [flow_rate, diff_pressure, turbidity, tss]
  note: "پیش‌تصفیه معمول؛ شست‌وشوی معکوس منبع پساب و مصرف آب داخلی است."
  ref: [M1-6.3]
- id: EQP-03-007
  fa: "فیلتر کارتریجی"
  en: "Cartridge filter"
  sub: cartridge_filter
  role: [treatment]
  in: [fresh_water]
  out: [fresh_water]
  params: [flow_rate, diff_pressure, turbidity]
  note: "حفاظت نهایی غشا؛ افزایش ΔP معیار تعویض."
  ref: [M1-6.3]
- id: EQP-03-008
  fa: "سامانه تزریق ضدرسوب و مواد شیمیایی غشا"
  en: "Membrane antiscalant and chemical dosing system"
  sub: chemical_dosing
  role: [treatment, control]
  in: [fresh_water]
  out: [fresh_water]
  params: [flow_rate, ph, chemical_consumption]
  note: "بازیابی مجاز RO به شیمی آب و تزریق صحیح ضدرسوب بستگی دارد."
  ref: [M1-6.3]
- id: EQP-03-009
  fa: "ایستگاه شست‌وشوی شیمیایی و فلاشینگ غشا (CIP غشا)"
  en: "Membrane chemical cleaning and flushing skid"
  sub: membrane_cip
  role: [treatment, use]
  in: [ro_permeate, fresh_water]
  out: [wastewater]
  params: [flow_rate, volume, ph, temperature]
  note: "شست‌وشو بر اساس شرایط واقعی غشا انجام شود؛ حجم پساب شیمیایی ثبت شود."
  ref: [M1-6.3]
- id: EQP-03-010
  fa: "خط مدیریت و استفاده مجدد کنسانتره RO"
  en: "RO concentrate handling and reuse line"
  sub: concentrate_reuse
  role: [recovery, discharge]
  in: [ro_concentrate]
  out: [reclaimed_water, wastewater]
  params: [flow_rate, ec, tds, volume]
  note: "استفاده مجدد فقط در کاربردهای سازگار با شوری؛ مازاد به تصفیه یا تخلیه می‌رود."
  ref: [M1-6.3, M1-8]
- id: EQP-03-011
  fa: "اسمز معکوس مرحله دوم"
  en: "Second-pass reverse osmosis"
  sub: reverse_osmosis
  role: [treatment]
  in: [ro_permeate]
  out: [ro_permeate, ro_concentrate]
  params: [flow_rate, pressure, ec, energy_consumption]
  note: "کیفیت آب بالا برای دیگ بخار یا فرآیند؛ کنسانتره مرحله دوم اغلب به ورودی مرحله اول برمی‌گردد."
  ref: [M1-6.3]
- id: EQP-03-012
  fa: "آب‌شیرین‌کن حرارتی چندمرحله‌ای (MED)"
  en: "Multiple-effect distillation (MED) desalination"
  sub: thermal_desalination
  ind: [IND-01, IND-02, IND-09]
  role: [treatment]
  in: [raw_water]
  out: [fresh_water, blowdown, cooling_water, condensate]
  flows: [steam]
  params: [flow_rate, temperature, pressure, tds, ec, steam_flow, energy_consumption, electric_power, level]
  note: "آب دریا در چند مرحله تبخیر و میعان می‌شود و آب شیرین (مقطر) با شوری بسیار کم تولید می‌کند. خروجی‌ها: آب شیرین، شورابه‌ی تخلیه‌شده (در این بانک با نوع جریان تخلیه ثبت می‌شود)، آب خنک‌کاری گرم‌شده‌ی کندانسور نهایی و کندانس بخار گرمایشی. مصرف بخار گرمایشی و نسبت آب تولیدی به بخار از شاخص‌های اصلی است."
- id: EQP-03-013
  fa: "آب‌شیرین‌کن MED با کمپرسور حرارتی بخار (MED-TVC)"
  en: "MED with thermal vapor compression (MED-TVC)"
  sub: thermal_desalination
  ind: [IND-01, IND-02, IND-09]
  role: [treatment]
  in: [raw_water]
  out: [fresh_water, blowdown, cooling_water, condensate]
  flows: [steam]
  params: [flow_rate, temperature, pressure, tds, ec, steam_flow, energy_consumption, electric_power, level]
  note: "بخشی از بخار یکی از مراحل با اجکتور بخار فشرده و دوباره به‌عنوان بخار گرمایشی استفاده می‌شود. مصرف بخار گرمایشی کمتر از MED ساده است. فشار و دبی بخار محرک اجکتور باید پایش شود."
- id: EQP-03-014
  fa: "آب‌شیرین‌کن تبخیر ناگهانی چندمرحله‌ای (MSF)"
  en: "Multi-stage flash (MSF) desalination"
  sub: thermal_desalination
  ind: [IND-01, IND-02, IND-09]
  role: [treatment]
  in: [raw_water]
  out: [fresh_water, blowdown, cooling_water, condensate]
  flows: [steam]
  params: [flow_rate, temperature, pressure, tds, ec, steam_flow, energy_consumption, electric_power, level]
  note: "آب دریای گرم‌شده در مرحله‌های پیاپی با فشار کاهنده به‌صورت ناگهانی تبخیر می‌شود. معمولاً کنار نیروگاه یا پالایشگاه نصب می‌شود. مصرف انرژی ویژه‌ی آن معمولاً از MED و RO بیشتر است و شورابه و آب خنک‌کاری حجم زیادی دارند."
- id: EQP-03-015
  fa: "آب‌شیرین‌کن تبخیری با تراکم مکانیکی بخار (MVC)"
  en: "Mechanical vapor compression (MVC) desalination"
  sub: thermal_desalination
  role: [treatment]
  in: [raw_water, wastewater, ro_concentrate]
  out: [fresh_water, blowdown]
  params: [flow_rate, temperature, pressure, tds, ec, electric_power, energy_consumption, level]
  note: "بخار تولیدشده با کمپرسور فشرده می‌شود و گرمای نهان آن دوباره تبخیر را تأمین می‌کند. انرژی اصلی برق است و بخار گرمایشی ندارد (جز هنگام راه‌اندازی). برای تغلیظ شورابه و پساب صنعتی هم به کار می‌رود."
- id: EQP-03-016
  fa: "الکترودیالیز معکوس (EDR)"
  en: "Electrodialysis reversal (EDR)"
  sub: electrodialysis
  role: [treatment]
  in: [fresh_water, raw_water, reclaimed_water]
  out: [ro_permeate, ro_concentrate]
  params: [flow_rate, ec, tds, ph, pressure, diff_pressure, electric_power, energy_consumption]
  note: "نمک‌ها با میدان الکتریکی و غشاهای انتخابگر یونی جدا می‌شوند و جهت جریان به‌صورت دوره‌ای معکوس می‌شود تا رسوب کم شود. مناسب آب لب‌شور و بازیافت پساب با شوری متوسط. ذرات معلق و ترکیبات غیریونی را حذف نمی‌کند. نوع جریان محصول و تغلیظ‌شده تا تعریف نوع جدید با انواع RO ثبت می‌شود."
