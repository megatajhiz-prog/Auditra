engine: CAL-01
defaults: {lvl: [site, process, equipment], eq: [ALL], status: expert_reviewed, reviewed_by: "CEP", reviewed_on: "2026-11-09"}
records:
- id: FRM-01-001
  fa: "باقیمانده‌ی موازنه‌ی آب یک گره (بر اساس دبی)"
  en: "Node water balance residual (flow-rate form)"
  expr: "R = sum(Q_in) - sum(Q_out) - dV_dt"
  vars:
  - {s: Q_in, fa: "دبی هر جریان ورودی به گره", u: "m3/h", k: m, p: flow_rate}
  - {s: Q_out, fa: "دبی هر جریان خروجی از گره", u: "m3/h", k: m, p: flow_rate}
  - {s: dV_dt, fa: "نرخ تغییر موجودی گره", u: "m3/h", k: d, from: [FRM-01-007]}
  res: {s: R, fa: "باقیمانده‌ی موازنه", u: "m3/h"}
  valid: "دبی‌ها باید هم‌زمان، هم‌واحد و روی یک مرز تعریف‌شده‌ی گره باشند. برای مقدار لحظه‌ای یا میانگین بازه‌ی کوتاه."
  err: "باقیمانده را خودکار نشتی فرض نکنید. با عدم قطعیت (FRM-01-008) و شاخص Z_R (FRM-01-009) بسنجید."
  ref: [M2-4.2]
- id: FRM-01-002
  fa: "باقیمانده‌ی موازنه‌ی آب در یک بازه‌ی زمانی (بر اساس حجم)"
  en: "Water balance residual over a period (volume form)"
  expr: "R_V = sum(V_in) - sum(V_out) - dS"
  vars:
  - {s: V_in, fa: "حجم هر جریان ورودی در بازه", u: "m3", k: m, p: volume}
  - {s: V_out, fa: "حجم هر جریان خروجی در بازه", u: "m3", k: m, p: volume}
  - {s: dS, fa: "تغییر موجودی ذخیره در بازه", u: "m3", k: d, from: [FRM-01-005, FRM-01-006]}
  res: {s: R_V, fa: "باقیمانده‌ی حجمی موازنه", u: "m3"}
  valid: "بازه‌ی زمانی همه‌ی جریان‌ها یکسان باشد (ماهانه، سالانه یا روزانه). حجم داخلی بازگشتی دوباره شمرده نشود."
  err: "اختلاف بازه‌ی خوانش کنتورها و بازه‌ی گزارش را اصلاح کنید. باقیمانده خودکار نشتی نیست."
  ref: [M2-4.2]
- id: FRM-01-003
  fa: "درصد خطای موازنه نسبت به کل ورودی"
  en: "Balance error as a percentage of total input"
  expr: "e = abs(R_V) / sum(V_in) * 100"
  vars:
  - {s: R_V, fa: "باقیمانده‌ی حجمی موازنه", u: "m3", k: d, from: [FRM-01-002]}
  - {s: V_in, fa: "حجم هر جریان ورودی", u: "m3", k: m, p: volume}
  res: {s: e, fa: "خطای موازنه", u: "%"}
  valid: "فقط وقتی کل ورودی بزرگ‌تر از صفر است. اگر کل ورودی صفر بود نتیجه تعریف‌نشده (null) است."
  err: "درصد ثابت (مثل ۱۰ درصد) فقط برای غربالگری است. پذیرش واقعی با Z_R و عدم قطعیت (FRM-01-009) انجام شود."
  ref: [M1-4.2, M2-4.2]
- id: FRM-01-004
  fa: "حجم عبوری از روی خوانش‌های دبی"
  en: "Volume from flow-rate readings"
  expr: "V = sum(Q_i * dt_i)"
  vars:
  - {s: Q_i, fa: "دبی در گام i", u: "m3/h", k: m, p: flow_rate}
  - {s: dt_i, fa: "طول گام زمانی i", u: "h", k: c}
  res: {s: V, fa: "حجم کل در بازه", u: "m3"}
  valid: "گام‌های زمانی پشت‌سرهم و بدون شکاف. برای دبی‌های متغیر، گام کوچک‌تر دقت بیشتر می‌دهد."
  err: "داده‌ی گمشده را با برچسب «برآوردی» پر کنید و جداگانه گزارش دهید. دبی منفی یا خارج از رنج کنتور رد شود."
- id: FRM-01-005
  fa: "تغییر موجودی مخزن از روی سطح (مخزن با سطح مقطع ثابت)"
  en: "Tank storage change from level (constant cross-section)"
  expr: "dS = A * (h_end - h_start)"
  vars:
  - {s: A, fa: "سطح مقطع مخزن", u: "m2", k: c}
  - {s: h_end, fa: "سطح آب در پایان بازه", u: "m", k: m, p: level}
  - {s: h_start, fa: "سطح آب در ابتدای بازه", u: "m", k: m, p: level}
  res: {s: dS, fa: "تغییر موجودی", u: "m3"}
  valid: "فقط برای مخزن یا حوضچه با سطح مقطع تقریباً ثابت. اگر سطح بر حسب درصد است ابتدا به متر تبدیل شود."
  err: "برای مخزن با شکل نامنظم از جدول حجم-سطح مخزن استفاده شود. نوسان سطح لحظه‌ای با میانگین‌گیری کاهش یابد."
- id: FRM-01-006
  fa: "تغییر موجودی از روی حجم ذخیره‌شده‌ی ابتدا و انتهای بازه"
  en: "Storage change from start and end stored volumes"
  expr: "dS = S_end - S_start"
  vars:
  - {s: S_end, fa: "حجم ذخیره در پایان بازه", u: "m3", k: m, p: volume}
  - {s: S_start, fa: "حجم ذخیره در ابتدای بازه", u: "m3", k: m, p: volume}
  res: {s: dS, fa: "تغییر موجودی", u: "m3"}
  valid: "حجم ذخیره‌ی همه‌ی مخازن و حوضچه‌های داخل مرز گره جمع شود."
  err: "اگر یکی از مخازن اندازه‌گیری نشده، موجودی آن تخمین و با برچسب برآوردی ثبت شود."
- id: FRM-01-007
  fa: "نرخ تغییر موجودی"
  en: "Storage change rate"
  expr: "dV_dt = dS / dt"
  vars:
  - {s: dS, fa: "تغییر موجودی در بازه", u: "m3", k: d, from: [FRM-01-005, FRM-01-006]}
  - {s: dt, fa: "طول بازه", u: "h", k: c}
  res: {s: dV_dt, fa: "نرخ تغییر موجودی", u: "m3/h"}
  valid: "بازه‌ی dt همان بازه‌ی اندازه‌گیری سطح یا حجم باشد."
  err: "برای dt بسیار کوچک، نوسان سطح مخزن خطای بزرگی می‌دهد."
- id: FRM-01-008
  fa: "عدم قطعیت ترکیبی باقیمانده‌ی موازنه (خطاهای مستقل)"
  en: "Combined uncertainty of the balance residual (independent errors)"
  expr: "u_R = sqrt(sum(u_i^2))"
  vars:
  - {s: u_i, fa: "عدم قطعیت هر جریان در ترازنامه", u: "m3", k: d, from: [FRM-01-010]}
  res: {s: u_R, fa: "عدم قطعیت باقیمانده", u: "m3"}
  valid: "فقط وقتی خطاهای اندازه‌گیری مستقل‌اند."
  err: "اگر خطاها همبسته‌اند (مثلاً چند کنتور هم‌نوع با خطای سیستماتیک مشترک)، کوواریانس هم وارد شود."
  ref: [M2-4.3]
- id: FRM-01-009
  fa: "شاخص معناداری باقیمانده (Z_R)"
  en: "Residual significance index (Z_R)"
  expr: "Z_R = R / u_R"
  vars:
  - {s: R, fa: "باقیمانده‌ی موازنه", u: "m3", k: d, from: [FRM-01-002]}
  - {s: u_R, fa: "عدم قطعیت باقیمانده", u: "m3", k: d, from: [FRM-01-008]}
  res: {s: Z_R, fa: "شاخص معناداری", u: "-"}
  valid: "R و u_R هم‌واحد باشند و u_R بزرگ‌تر از صفر."
  err: "اگر u_R صفر یا نامعلوم است، عدم قطعیت را برآورد کنید و نتیجه را غیرقابل‌اتکا علامت بزنید."
  ref: [M2-4.3]
- id: FRM-01-010
  fa: "عدم قطعیت یک خوانش بر اساس دقت کنتور"
  en: "Uncertainty of a single reading from meter accuracy"
  expr: "u_i = a * x_i"
  vars:
  - {s: a, fa: "دقت نسبی کنتور (کسر، نه درصد)", u: "-", k: c}
  - {s: x_i, fa: "مقدار خوانش‌شده", u: "m3", k: m, p: volume}
  res: {s: u_i, fa: "عدم قطعیت خوانش", u: "m3"}
  valid: "دقت کنتور باید از برگه‌ی مشخصات یا گواهی کالیبراسیون باشد و کنتور در رنج کاری کار کند."
  err: "کنتور کالیبره‌نشده یا برآوردی دقت بدتری دارد و باید ضریب بزرگ‌تری بگیرد."
- id: FRM-01-011
  fa: "تصمیم پذیرش بسته شدن موازنه"
  en: "Balance closure acceptance decision"
  expr: "closed = abs(Z_R) <= k"
  vars:
  - {s: Z_R, fa: "شاخص معناداری باقیمانده", u: "-", k: d, from: [FRM-01-009]}
  - {s: k, fa: "ضریب پوشش (معمولاً ۲ برای حدود ۹۵ درصد)", u: "-", k: c}
  res: {s: closed, fa: "موازنه بسته شده است (درست/نادرست)", u: "-"}
  valid: "ضریب پوشش را سیاست ممیزی تعیین می‌کند."
  err: "موازنه‌ی «بسته‌شده» اثبات نبودن نشتی نیست. فقط می‌گوید اختلاف از عدم قطعیت اندازه‌گیری بزرگ‌تر نیست."
  ref: [M2-4.3]
- id: FRM-01-012
  fa: "موازنه‌ی آب کل مجتمع (سطح اول)"
  en: "Site-level water balance (level 1)"
  expr: "R_site = V_withdrawal + V_import + V_rain - V_discharge - V_evap - V_product - V_other - dS"
  vars:
  - {s: V_withdrawal, fa: "برداشت از منابع (چاه، رودخانه و غیره)", u: "m3", k: m, p: volume}
  - {s: V_import, fa: "آب وارداتی (شبکه شهری، تانکر)", u: "m3", k: m, p: volume}
  - {s: V_rain, fa: "آب باران جمع‌آوری‌شده", u: "m3", k: m, p: volume}
  - {s: V_discharge, fa: "پساب تخلیه‌شده از مجتمع", u: "m3", k: m, p: volume}
  - {s: V_evap, fa: "تبخیر", u: "m3", k: d}
  - {s: V_product, fa: "آب خارج‌شده در محصول", u: "m3", k: d}
  - {s: V_other, fa: "سایر خروجی‌ها (لجن، رطوبت و غیره)", u: "m3", k: d}
  - {s: dS, fa: "تغییر موجودی مخازن", u: "m3", k: d, from: [FRM-01-005, FRM-01-006]}
  res: {s: R_site, fa: "باقیمانده‌ی موازنه‌ی مجتمع", u: "m3"}
  valid: "مرز مجتمع کامل تعریف شود. جریان بازیافتی داخلی به‌عنوان منبع جدید شمرده نشود."
  err: "خروجی‌های محاسباتی (تبخیر، آب در محصول) سهم بزرگی از عدم قطعیت‌اند. با برچسب برآوردی ثبت شوند."
  lvl: [site]
  ref: [M1-4.1]
- id: FRM-01-013
  fa: "موازنه‌ی آب یک واحد فرآیندی (سطح دوم)"
  en: "Process-unit water balance (level 2)"
  expr: "R_unit = V_in + V_return_in - V_waste - V_evap - V_product - V_return_out - dS"
  vars:
  - {s: V_in, fa: "آب ورودی از شبکه‌ی مجتمع", u: "m3", k: m, p: volume}
  - {s: V_return_in, fa: "جریان بازگشتی یا بازیافتی ورودی به واحد", u: "m3", k: m, p: volume}
  - {s: V_waste, fa: "پساب خروجی واحد", u: "m3", k: m, p: volume}
  - {s: V_evap, fa: "تبخیر واحد", u: "m3", k: d}
  - {s: V_product, fa: "آب در محصول واحد", u: "m3", k: d}
  - {s: V_return_out, fa: "جریان بازگشتی یا بازیافتی خروجی از واحد", u: "m3", k: m, p: volume}
  - {s: dS, fa: "تغییر موجودی واحد", u: "m3", k: d, from: [FRM-01-005, FRM-01-006]}
  res: {s: R_unit, fa: "باقیمانده‌ی موازنه‌ی واحد", u: "m3"}
  valid: "مرز واحد با شبکه‌ی داخلی دقیقاً مشخص باشد. جمع باقیمانده‌ی واحدها با باقیمانده‌ی مجتمع سازگار باشد."
  err: "اختلاف جمع تجهیزات با کل واحد به‌صورت «آب حسابرسی‌نشده» جدا گزارش شود."
  lvl: [process]
  ref: [M2-4.2]
- id: FRM-01-014
  fa: "موازنه‌ی آب یک تجهیز (سطح سوم) با تلفات شناخته‌شده"
  en: "Equipment-level water balance with known losses"
  expr: "R_eq = Q_in - Q_out - Q_evap - Q_drift - Q_leak - dV_dt"
  vars:
  - {s: Q_in, fa: "دبی ورودی تجهیز", u: "m3/h", k: m, p: flow_rate}
  - {s: Q_out, fa: "دبی خروجی تجهیز", u: "m3/h", k: m, p: flow_rate}
  - {s: Q_evap, fa: "دبی تبخیر", u: "m3/h", k: d}
  - {s: Q_drift, fa: "دبی دریفت", u: "m3/h", k: d}
  - {s: Q_leak, fa: "دبی نشتی شناخته‌شده", u: "m3/h", k: d}
  - {s: dV_dt, fa: "نرخ تغییر موجودی تجهیز", u: "m3/h", k: d, from: [FRM-01-007]}
  res: {s: R_eq, fa: "باقیمانده‌ی موازنه‌ی تجهیز", u: "m3/h"}
  valid: "دبی‌ها هم‌زمان و در حالت پایدار یا با اصلاح تغییر موجودی."
  err: "برای تجهیز بدون کنتور ورودی و خروجی، مقادیر برآوردی با برچسب مشخص شوند."
  lvl: [equipment]
- id: FRM-01-015
  fa: "آب تازه‌ی مصرفی بدون شمارش دوباره‌ی جریان بازگشتی داخلی"
  en: "Fresh-water intake excluding internal recirculation"
  expr: "V_fresh = V_total_in - V_recycle_internal"
  vars:
  - {s: V_total_in, fa: "مجموع ورودی به واحد یا مجتمع (شامل بازگشتی)", u: "m3", k: m, p: volume}
  - {s: V_recycle_internal, fa: "حجم بازچرخانی داخلی", u: "m3", k: m, p: volume}
  res: {s: V_fresh, fa: "آب تازه‌ی واقعی", u: "m3"}
  valid: "بازچرخانی باید دقیقاً همان آبی باشد که از خروجی یک نقطه به ورودی نقطه‌ی دیگر داخل همان مرز برمی‌گردد."
  err: "اگر بازچرخانی اندازه‌گیری نشده، تخمین آن را به‌عنوان برآوردی علامت بزنید."
  lvl: [site, process]
  ref: [M1-4.1]
- id: FRM-01-016
  fa: "باقیمانده‌ی موازنه‌ی املاح محلول (بررسی متقاطع)"
  en: "Dissolved-solids mass balance residual (cross-check)"
  expr: "R_c = sum(Q_in * c_in) - sum(Q_out * c_out) - dM_dt"
  vars:
  - {s: Q_in, fa: "دبی هر جریان ورودی", u: "m3/h", k: m, p: flow_rate}
  - {s: c_in, fa: "غلظت املاح محلول جریان ورودی", u: "mg/L", k: m, p: tds}
  - {s: Q_out, fa: "دبی هر جریان خروجی", u: "m3/h", k: m, p: flow_rate}
  - {s: c_out, fa: "غلظت املاح محلول جریان خروجی", u: "mg/L", k: m, p: tds}
  - {s: dM_dt, fa: "نرخ تغییر جرم املاح در موجودی", u: "g/h", k: d}
  res: {s: R_c, fa: "باقیمانده‌ی موازنه‌ی املاح", u: "g/h"}
  valid: "mg/L برابر g/m3 است. غلظت‌ها باید با یک روش اندازه‌گیری TDS یا همان نسبت تبدیل از هدایت الکتریکی باشند."
  err: "تبخیر املاح را خارج نمی‌کند و تفاوت موازنه‌ی آب و املاح می‌تواند خطای دبی یا تبخیر را نشان دهد."
- id: FRM-01-017
  fa: "باقیمانده‌ی تبیین‌نشده پس از کسر تلفات برآوردی"
  en: "Unexplained residual after estimated losses"
  expr: "R_u = R - L_est"
  vars:
  - {s: R, fa: "باقیمانده‌ی موازنه", u: "m3", k: d, from: [FRM-01-002]}
  - {s: L_est, fa: "مجموع تلفات برآوردی (دریفت، نشتی شناخته‌شده و غیره)", u: "m3", k: d}
  res: {s: R_u, fa: "باقیمانده‌ی تبیین‌نشده", u: "m3"}
  valid: "فقط تلفاتی کسر شود که روش برآورد و منبع دارند."
  err: "باقیمانده‌ی تبیین‌نشده‌ی بزرگ‌تر از عدم قطعیت (FRM-01-009) نیاز به بازرسی میدانی دارد."
