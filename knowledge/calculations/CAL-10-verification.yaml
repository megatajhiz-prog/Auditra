engine: CAL-10
defaults: {lvl: [site, process, equipment], eq: [ALL], status: expert_reviewed, reviewed_by: "CEP", reviewed_on: "2026-11-12"}
records:
- id: FRM-10-001
  fa: "صرفه‌جویی خام (مقایسه‌ی ساده‌ی قبل و بعد)"
  en: "Raw before-after saving"
  expr: "S_raw = W_before - W_after"
  vars:
  - {s: W_before, fa: "مصرف دوره‌ی قبل از اجرای راهکار", u: "m3", k: m, p: volume}
  - {s: W_after, fa: "مصرف دوره‌ی بعد از اجرای راهکار", u: "m3", k: m, p: volume}
  res: {s: S_raw, fa: "صرفه‌جویی خام", u: "m3"}
  valid: "دو دوره هم‌طول و هم‌مرز باشند."
  err: "مقایسه‌ی ساده‌ی دو عدد کافی نیست و به‌تنهایی صرفه‌جویی واقعی را نشان نمی‌دهد. تولید، محصول، ساعات کارکرد، دما، کیفیت آب و تغییر فرآیند یا تجهیزات باید تعدیل شوند."
  ref: [M1-8.2]
- id: FRM-10-002
  fa: "اثر تعدیل شرایط بر صرفه‌جویی"
  en: "Effect of condition adjustment on the saving"
  expr: "dAdj = S_adj - S_raw"
  vars:
  - {s: S_adj, fa: "صرفه‌جویی تعدیل‌شده", u: "m3", k: d, from: [FRM-07-004]}
  - {s: S_raw, fa: "صرفه‌جویی خام", u: "m3", k: d, from: [FRM-10-001]}
  res: {s: dAdj, fa: "اثر تعدیل", u: "m3"}
  valid: "S_adj و S_raw هم‌بازه باشند."
  err: "اثر تعدیل بزرگ یعنی شرایط بین دو دوره تغییر زیادی کرده و صرفه‌جویی خام گمراه‌کننده است. دلیل هر تعدیل مستند شود."
  ref: [M1-8.2]
- id: FRM-10-003
  fa: "عدم قطعیت مدل خط مبنا روی صرفه‌جویی m دوره"
  en: "Baseline-model uncertainty of the saving over m periods"
  expr: "u_model = s_res * sqrt(m)"
  vars:
  - {s: s_res, fa: "خطای استاندارد باقیمانده‌های مدل خط مبنا", u: "m3", k: d, from: [FRM-07-007]}
  - {s: m, fa: "تعداد دوره‌های گزارش", u: "-", k: c}
  res: {s: u_model, fa: "عدم قطعیت مدل", u: "m3"}
  valid: "خطای مدل در دوره‌ها مستقل فرض شده است."
  err: "خودهمبستگی باقیمانده‌ها و عدم قطعیت ضرایب مدل را در نظر نمی‌گیرد. برای تعداد دوره‌ی مبنای کم، مقدار کمتر از واقع می‌شود و باید ضریب یا روش مرجع (مثل IPMVP و ASHRAE Guideline 14) به‌کار رود."
- id: FRM-10-004
  fa: "عدم قطعیت ترکیبی صرفه‌جویی"
  en: "Combined uncertainty of the saving"
  expr: "u_S = sqrt(u_model^2 + u_meas^2 + u_adj^2)"
  vars:
  - {s: u_model, fa: "عدم قطعیت مدل خط مبنا", u: "m3", k: d, from: [FRM-10-003]}
  - {s: u_meas, fa: "عدم قطعیت اندازه‌گیری (کنتورها)", u: "m3", k: d, from: [FRM-01-008]}
  - {s: u_adj, fa: "عدم قطعیت تعدیل‌ها", u: "m3", k: c}
  res: {s: u_S, fa: "عدم قطعیت ترکیبی صرفه‌جویی", u: "m3"}
  valid: "منابع خطا مستقل فرض شده‌اند."
  err: "اگر خطاها همبسته‌اند (مثلاً کنتور واحد قبل و بعد)، کوواریانس هم وارد شود. u_adj باید مبنای برآورد داشته باشد."
  ref: [M1-8.2]
- id: FRM-10-005
  fa: "عدم قطعیت بسط‌یافته"
  en: "Expanded uncertainty"
  expr: "U = k * u_S"
  vars:
  - {s: k, fa: "ضریب پوشش (معمولاً ۲ برای حدود ۹۵ درصد)", u: "-", k: c}
  - {s: u_S, fa: "عدم قطعیت ترکیبی", u: "m3", k: d, from: [FRM-10-004]}
  res: {s: U, fa: "عدم قطعیت بسط‌یافته", u: "m3"}
  valid: "ضریب پوشش را سیاست ممیزی تعیین می‌کند و با سطح اطمینان گزارش شود."
  err: "هر گزارش صرفه‌جویی همراه U و سطح اطمینان آن ارائه شود."
  ref: [M1-8.2]
- id: FRM-10-006
  fa: "شاخص معناداری صرفه‌جویی"
  en: "Saving significance index"
  expr: "Z_S = S / u_S"
  vars:
  - {s: S, fa: "صرفه‌جویی تعدیل‌شده", u: "m3", k: d, from: [FRM-07-004]}
  - {s: u_S, fa: "عدم قطعیت ترکیبی", u: "m3", k: d, from: [FRM-10-004]}
  res: {s: Z_S, fa: "شاخص معناداری", u: "-"}
  valid: "u_S بزرگ‌تر از صفر."
  err: "Z_S کوچک یعنی صرفه‌جویی در محدوده‌ی خطا است و نمی‌توان آن را قطعی دانست."
- id: FRM-10-007
  fa: "تصمیم معناداری صرفه‌جویی"
  en: "Saving significance decision"
  expr: "significant = abs(S) > U"
  vars:
  - {s: S, fa: "صرفه‌جویی تعدیل‌شده", u: "m3", k: d, from: [FRM-07-004]}
  - {s: U, fa: "عدم قطعیت بسط‌یافته", u: "m3", k: d, from: [FRM-10-005]}
  res: {s: significant, fa: "صرفه‌جویی معنادار است (درست/نادرست)", u: "-"}
  valid: "سطح اطمینان همان ضریب پوشش FRM-10-005."
  err: "نامعنادار بودن یعنی اثبات نشده، نه اینکه صرفه‌جویی صفر است. با دوره‌ی طولانی‌تر یا اندازه‌گیری دقیق‌تر بررسی شود."
- id: FRM-10-008
  fa: "عدم قطعیت نسبی صرفه‌جویی"
  en: "Relative uncertainty of the saving"
  expr: "rel = U / abs(S) * 100"
  vars:
  - {s: U, fa: "عدم قطعیت بسط‌یافته", u: "m3", k: d, from: [FRM-10-005]}
  - {s: S, fa: "صرفه‌جویی تعدیل‌شده", u: "m3", k: d, from: [FRM-07-004]}
  res: {s: rel, fa: "عدم قطعیت نسبی", u: "%"}
  valid: "S مخالف صفر."
  err: "عدد بزرگ‌تر از ۱۰۰ درصد یعنی صرفه‌جویی قابل‌اتکا نیست."
- id: FRM-10-009
  fa: "کمینه‌ی صرفه‌جویی قابل‌تشخیص (درصد خط مبنا)"
  en: "Minimum detectable saving (% of baseline)"
  expr: "MDS = U / W_adj * 100"
  vars:
  - {s: U, fa: "عدم قطعیت بسط‌یافته", u: "m3", k: d, from: [FRM-10-005]}
  - {s: W_adj, fa: "خط مبنای تعدیل‌شده", u: "m3", k: d, from: [FRM-07-003]}
  res: {s: MDS, fa: "کمینه‌ی صرفه‌جویی قابل‌تشخیص", u: "%"}
  valid: "W_adj بزرگ‌تر از صفر."
  err: "راهکاری که صرفه‌جویی انتظاری‌اش کمتر از MDS است با این اندازه‌گیری و مدل قابل راستی‌آزمایی نیست."
- id: FRM-10-010
  fa: "صرفه‌جویی محافظه‌کارانه"
  en: "Conservative saving"
  expr: "S_cons = max(0, S - U)"
  vars:
  - {s: S, fa: "صرفه‌جویی تعدیل‌شده", u: "m3", k: d, from: [FRM-07-004]}
  - {s: U, fa: "عدم قطعیت بسط‌یافته", u: "m3", k: d, from: [FRM-10-005]}
  res: {s: S_cons, fa: "صرفه‌جویی محافظه‌کارانه", u: "m3"}
  valid: "برای اعلام صرفه‌جویی مالی یا قراردادی از این مقدار استفاده شود."
  err: "مقدار تعدیل‌شده‌ی اصلی هم همراه گزارش شود."
- id: FRM-10-011
  fa: "مجموع تجمعی صرفه‌جویی‌های تأییدشده"
  en: "Cumulative verified saving"
  expr: "S_cum = sum(S_i)"
  vars:
  - {s: S_i, fa: "صرفه‌جویی تأییدشده‌ی دوره‌ی i", u: "m3", k: d, from: [FRM-07-004]}
  res: {s: S_cum, fa: "مجموع تجمعی", u: "m3"}
  valid: "دوره‌ها بدون هم‌پوشانی و با یک خط مبنا باشند."
  err: "تغییر مدل خط مبنا در میانه‌ی دوره‌ی گزارش ثبت و دلیل آن مستند شود."
- id: FRM-10-012
  fa: "عدم قطعیت بسط‌یافته‌ی مجموع تجمعی"
  en: "Expanded uncertainty of the cumulative saving"
  expr: "U_cum = k * sqrt(sum(u_i^2))"
  vars:
  - {s: k, fa: "ضریب پوشش", u: "-", k: c}
  - {s: u_i, fa: "عدم قطعیت ترکیبی دوره‌ی i", u: "m3", k: d, from: [FRM-10-004]}
  res: {s: U_cum, fa: "عدم قطعیت مجموع تجمعی", u: "m3"}
  valid: "خطای دوره‌ها مستقل فرض شده است."
  err: "اگر خطای سیستماتیک مشترک وجود دارد (مثلاً یک کنتور)، جمع جبری آن لحاظ شود نه جذر مجموع مربعات."
- id: FRM-10-013
  fa: "پایداری صرفه‌جویی در زمان"
  en: "Persistence of the saving"
  expr: "P_t = S_t / S_1 * 100"
  vars:
  - {s: S_t, fa: "صرفه‌جویی دوره‌ی t", u: "m3", k: d, from: [FRM-07-004]}
  - {s: S_1, fa: "صرفه‌جویی دوره‌ی اول تأییدشده", u: "m3", k: d, from: [FRM-07-004]}
  res: {s: P_t, fa: "پایداری صرفه‌جویی", u: "%"}
  valid: "S_1 بزرگ‌تر از صفر. دوره‌ها هم‌طول و هم‌فصل باشند."
  err: "افت پایداری نشانه‌ی خرابی، تغییر بهره‌برداری یا فرسودگی تجهیز است و باید بازرسی شود."
- id: FRM-10-014
  fa: "نرخ تحقق صرفه‌جویی (نسبت به پیش‌بینی)"
  en: "Savings realization rate"
  expr: "RR = S_ver / S_pred * 100"
  vars:
  - {s: S_ver, fa: "صرفه‌جویی تأییدشده", u: "m3", k: d, from: [FRM-07-004]}
  - {s: S_pred, fa: "صرفه‌جویی پیش‌بینی‌شده‌ی راهکار", u: "m3", k: c}
  res: {s: RR, fa: "نرخ تحقق", u: "%"}
  valid: "S_pred از فرصت مستند‌شده‌ی ممیزی (CAL-08) باشد."
  err: "نرخ تحقق پایین یا بالا، دقت مدل پیش‌بینی فرصت‌ها را نشان می‌دهد و برای اصلاح آن‌ها استفاده شود."
- id: FRM-10-015
  fa: "پرچم برون‌یابی خارج از محدوده‌ی مدل"
  en: "Out-of-range extrapolation flag"
  expr: "out = (x < x_min) or (x > x_max)"
  vars:
  - {s: x, fa: "مقدار متغیر مستقل در دوره‌ی گزارش (تولید، دما یا ساعات کارکرد)", u: "-", k: c}
  - {s: x_min, fa: "کمینه‌ی مقدار در داده‌ی مبنا", u: "-", k: c}
  - {s: x_max, fa: "بیشینه‌ی مقدار در داده‌ی مبنا", u: "-", k: c}
  res: {s: out, fa: "خارج از محدوده‌ی مدل (درست/نادرست)", u: "-"}
  valid: "برای هر متغیر مستقل مدل جدا بررسی شود."
  err: "خط مبنا فقط در محدوده‌ی داده‌ی دوره‌ی مبنا معتبر است. در برون‌یابی صرفه‌جویی غیرقابل‌اتکا علامت بخورد."
- id: FRM-10-016
  fa: "توافق دو روش راستی‌آزمایی"
  en: "Agreement between two verification methods"
  expr: "D = abs(S_a - S_b) / ((S_a + S_b) / 2) * 100"
  vars:
  - {s: S_a, fa: "صرفه‌جویی به روش اول (مثلاً خط مبنا)", u: "m3", k: d, from: [FRM-07-004]}
  - {s: S_b, fa: "صرفه‌جویی به روش دوم (مثلاً موازنه یا اندازه‌گیری مستقیم)", u: "m3", k: c}
  res: {s: D, fa: "اختلاف دو روش", u: "%"}
  valid: "S_a و S_b هم‌مرز و هم‌بازه باشند و میانگینشان صفر نباشد."
  err: "اختلاف بزرگ‌تر از عدم قطعیت یکی از دو روش نیاز به بررسی علت دارد."
- id: FRM-10-017
  fa: "تعداد دوره‌ی لازم برای تشخیص صرفه‌جویی هدف"
  en: "Periods needed to detect a target saving"
  expr: "m_req = (k * s_res / s_p)^2"
  vars:
  - {s: k, fa: "ضریب پوشش", u: "-", k: c}
  - {s: s_res, fa: "خطای استاندارد مدل", u: "m3", k: d, from: [FRM-07-007]}
  - {s: s_p, fa: "صرفه‌جویی هدف در هر دوره", u: "m3", k: c}
  res: {s: m_req, fa: "تعداد دوره‌ی لازم", u: "-"}
  valid: "s_p بزرگ‌تر از صفر. از رابطه‌ی u_model = s_res·√m مشتق شده است."
  err: "تقریبی است. برای برنامه‌ریزی دوره‌ی گزارش‌دهی قبل از اجرای پروژه به کار می‌رود."
- id: FRM-10-018
  fa: "ارزش مالی صرفه‌جویی تأییدشده (محافظه‌کارانه)"
  en: "Verified financial value of the saving (conservative)"
  expr: "V_fin = S_cons * C_water"
  vars:
  - {s: S_cons, fa: "صرفه‌جویی محافظه‌کارانه", u: "m3", k: d, from: [FRM-10-010]}
  - {s: C_water, fa: "هزینه‌ی واقعی هر مترمکعب آب", u: "currency/m3", k: d, from: [FRM-09-001]}
  res: {s: V_fin, fa: "ارزش مالی تأییدشده", u: "currency"}
  valid: "قیمت باید هزینه‌ی نهایی همان آب باشد (FRM-09-004)."
  err: "با صرفه‌جویی مالی مورد انتظار (FRM-09-004) مقایسه و اختلاف توضیح داده شود."
