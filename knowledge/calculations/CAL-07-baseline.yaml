engine: CAL-07
defaults: {lvl: [site, process, equipment], eq: [ALL], status: expert_reviewed, reviewed_by: "CEP", reviewed_on: "2026-11-10"}
records:
- id: FRM-07-001
  fa: "مدل خط مبنای مصرف آب (تولید، دما و ساعات کارکرد)"
  en: "Water consumption baseline model (production, temperature, operating hours)"
  expr: "W_base = b0 + b1 * P + b2 * T + b3 * H"
  vars:
  - {s: b0, fa: "عرض از مبدأ (مصرف ثابت مستقل از تولید)", u: "m3", k: c}
  - {s: b1, fa: "ضریب تولید", u: "m3/t", k: c}
  - {s: b2, fa: "ضریب دما", u: "m3/°C", k: c}
  - {s: b3, fa: "ضریب ساعات کارکرد", u: "m3/h", k: c}
  - {s: P, fa: "مقدار تولید دوره", u: "t", k: d, from: [FRM-02-006]}
  - {s: T, fa: "دمای محیط یا متغیر اقلیمی مناسب (میانگین دوره)", u: "°C", k: m, p: temperature}
  - {s: H, fa: "ساعات کارکرد دوره", u: "h", k: m, p: run_time}
  res: {s: W_base, fa: "مصرف مورد انتظار (خط مبنا)", u: "m3"}
  valid: "ضرایب از رگرسیون روی داده‌ی دوره‌ی مبنا (FRM-07-006) می‌آیند. مدل فقط در محدوده‌ی تولید و دمای داده‌ی مبنا معتبر است و برای صنایع چندمحصولی تولید هر محصول جدا وارد شود (FRM-07-002)."
  err: "قبل از استفاده R2، CV(RMSE) و NMBE (FRM-07-008 تا FRM-07-010) و باقیمانده‌ها بررسی شود. تغییر ظرفیت، تعطیلی، تعمیرات اساسی، تغییر محصول و کیفیت مواد اولیه باید بررسی شود."
  ref: [M2-4.4]
- id: FRM-07-002
  fa: "خط مبنا برای صنایع چندمحصولی"
  en: "Baseline for multi-product plants"
  expr: "W_base = b0 + sum(b_j * P_j) + b_T * T + b_H * H"
  vars:
  - {s: b0, fa: "مصرف ثابت", u: "m3", k: c}
  - {s: b_j, fa: "ضریب تولید محصول j", u: "m3/t", k: c}
  - {s: P_j, fa: "تولید محصول j", u: "t", k: d, from: [FRM-02-006]}
  - {s: b_T, fa: "ضریب دما", u: "m3/°C", k: c}
  - {s: T, fa: "دمای محیط (میانگین دوره)", u: "°C", k: m, p: temperature}
  - {s: b_H, fa: "ضریب ساعات کارکرد", u: "m3/h", k: c}
  - {s: H, fa: "ساعات کارکرد دوره", u: "h", k: m, p: run_time}
  res: {s: W_base, fa: "مصرف مورد انتظار (خط مبنا)", u: "m3"}
  valid: "تولید هر محصول جداگانه و هم‌مقیاس وارد شود. محصولات هم‌خط و هم‌بسته (همبستگی شدید) مدل را ناپایدار می‌کنند."
  err: "ضرایب منفی یا غیرمنطقی نشانه‌ی هم‌خطی یا کمبود داده است و باید بررسی شود."
  ref: [M2-4.4]
- id: FRM-07-003
  fa: "خط مبنای تعدیل‌شده برای رویدادهای غیرعادی"
  en: "Baseline adjusted for non-routine events"
  expr: "W_adj = W_base + A_nr"
  vars:
  - {s: W_base, fa: "مصرف مورد انتظار از مدل", u: "m3", k: d, from: [FRM-07-001, FRM-07-002]}
  - {s: A_nr, fa: "تعدیل رویدادهای غیرعادی (تعطیلی، تعمیرات اساسی، تغییر محصول یا ظرفیت)", u: "m3", k: c}
  res: {s: W_adj, fa: "خط مبنای تعدیل‌شده", u: "m3"}
  valid: "هر تعدیل با دلیل، روش محاسبه و تأییدکننده ثبت شود."
  err: "تعدیل بی‌مستند اعتبار صرفه‌جویی را از بین می‌برد."
  ref: [M2-4.4]
- id: FRM-07-004
  fa: "صرفه‌جویی آب در دوره"
  en: "Water saving in a period"
  expr: "S = W_adj - W_actual"
  vars:
  - {s: W_adj, fa: "خط مبنای تعدیل‌شده", u: "m3", k: d, from: [FRM-07-003]}
  - {s: W_actual, fa: "مصرف واقعی دوره", u: "m3", k: m, p: volume}
  res: {s: S, fa: "صرفه‌جویی (مثبت یعنی کاهش مصرف)", u: "m3"}
  valid: "هر دو در یک بازه و یک مرز اندازه‌گیری. مرز و روش حساب خط مبنا از ابتدا ثابت و مکتوب باشد."
  err: "صرفه‌جویی باید با عدم قطعیت مدل و کنتور سنجیده شود (CAL-10)."
  ref: [M2-4.4]
- id: FRM-07-005
  fa: "درصد صرفه‌جویی نسبت به خط مبنا"
  en: "Saving as a percentage of baseline"
  expr: "S_pct = S / W_adj * 100"
  vars:
  - {s: S, fa: "صرفه‌جویی", u: "m3", k: d, from: [FRM-07-004]}
  - {s: W_adj, fa: "خط مبنای تعدیل‌شده", u: "m3", k: d, from: [FRM-07-003]}
  res: {s: S_pct, fa: "درصد صرفه‌جویی", u: "%"}
  valid: "W_adj بزرگ‌تر از صفر."
  err: "درصد کوچک‌تر از خطای مدل را صرفه‌جویی واقعی ندانید."
- id: FRM-07-006
  fa: "ضرایب خط مبنا به روش کمترین مربعات"
  en: "Baseline coefficients by ordinary least squares"
  expr: "b = inv(X^T * X) * X^T * y"
  vars:
  - {s: X, fa: "ماتریس متغیرهای مستقل (ستون ۱، تولید، دما، ساعات کارکرد) برای هر دوره", u: "-", k: d}
  - {s: y, fa: "مصرف واقعی هر دوره‌ی مبنا", u: "m3", k: m, p: volume}
  res: {s: b, fa: "بردار ضرایب مدل", u: "-"}
  valid: "تعداد دوره‌ها به‌طور محسوس بیشتر از تعداد ضرایب. دوره‌ی مبنا یک چرخه‌ی کامل کارکرد (مثلاً یک سال) و بدون رویداد غیرعادی. متغیرهای هم‌خط خارج شوند."
  err: "فرض خطی بودن و پراکندگی ثابت باقیمانده‌ها با نمودار باقیمانده بررسی شود."
- id: FRM-07-007
  fa: "خطای استاندارد باقیمانده‌های مدل"
  en: "Residual standard error of the model"
  expr: "s_res = sqrt(sum((y_i - yhat_i)^2) / (n - p))"
  vars:
  - {s: y_i, fa: "مصرف واقعی دوره‌ی i", u: "m3", k: m, p: volume}
  - {s: yhat_i, fa: "مصرف پیش‌بینی‌شده‌ی مدل برای دوره‌ی i", u: "m3", k: d, from: [FRM-07-001, FRM-07-002]}
  - {s: n, fa: "تعداد دوره‌ها", u: "-", k: c}
  - {s: p, fa: "تعداد ضرایب مدل", u: "-", k: c}
  res: {s: s_res, fa: "خطای استاندارد", u: "m3"}
  valid: "n بزرگ‌تر از p."
  err: "از همین مقدار برای باقیمانده‌ی استانداردشده‌ی FRM-04-013 استفاده می‌شود."
- id: FRM-07-008
  fa: "ضریب تعیین مدل (R2)"
  en: "Coefficient of determination (R2)"
  expr: "R2 = 1 - sum((y_i - yhat_i)^2) / sum((y_i - ybar)^2)"
  vars:
  - {s: y_i, fa: "مصرف واقعی دوره‌ی i", u: "m3", k: m, p: volume}
  - {s: yhat_i, fa: "مصرف پیش‌بینی‌شده", u: "m3", k: d, from: [FRM-07-001, FRM-07-002]}
  - {s: ybar, fa: "میانگین مصرف واقعی", u: "m3", k: d}
  res: {s: R2, fa: "ضریب تعیین", u: "-"}
  valid: "با افزودن متغیر همواره بالا می‌رود. برای مقایسه‌ی مدل‌ها همراه شاخص‌های دیگر استفاده شود."
  err: "R2 بالا به‌تنهایی صحت پیش‌بینی را ثابت نمی‌کند."
- id: FRM-07-009
  fa: "ضریب تغییرات ریشه‌ی میانگین مربعات خطا (CV(RMSE))"
  en: "Coefficient of variation of the RMSE (CV(RMSE))"
  expr: "CVRMSE = s_res / ybar * 100"
  vars:
  - {s: s_res, fa: "خطای استاندارد مدل", u: "m3", k: d, from: [FRM-07-007]}
  - {s: ybar, fa: "میانگین مصرف واقعی", u: "m3", k: d}
  res: {s: CVRMSE, fa: "CV(RMSE)", u: "%"}
  valid: "حد پذیرش را ممیز با مرجع اندازه‌گیری و راستی‌آزمایی (مثل IPMVP یا ASHRAE Guideline 14) و گام زمانی داده تعیین کند."
  err: "عدد برای داده‌های ماهانه و روزانه تفاوت دارد و باید با حد همان گام مقایسه شود."
- id: FRM-07-010
  fa: "سوگیری میانگین نرمال‌شده‌ی مدل (NMBE)"
  en: "Normalized mean bias error (NMBE)"
  expr: "NMBE = sum(y_i - yhat_i) / ((n - p) * ybar) * 100"
  vars:
  - {s: y_i, fa: "مصرف واقعی دوره‌ی i", u: "m3", k: m, p: volume}
  - {s: yhat_i, fa: "مصرف پیش‌بینی‌شده", u: "m3", k: d, from: [FRM-07-001, FRM-07-002]}
  - {s: n, fa: "تعداد دوره‌ها", u: "-", k: c}
  - {s: p, fa: "تعداد ضرایب", u: "-", k: c}
  - {s: ybar, fa: "میانگین مصرف واقعی", u: "m3", k: d}
  res: {s: NMBE, fa: "NMBE", u: "%"}
  valid: "در رگرسیون با عرض از مبدأ، در داده‌ی آموزشی نزدیک صفر است و اهمیت اصلی‌اش در دوره‌ی اعتبارسنجی است."
  err: "مقدار بزرگ در دوره‌ی اعتبارسنجی نشانه‌ی تغییر شرایط یا سوگیری مدل است."
- id: FRM-07-011
  fa: "مصرف نرمال‌شده به شرایط مرجع"
  en: "Consumption normalized to reference conditions"
  expr: "W_norm = W_actual + (W_base_ref - W_base_act)"
  vars:
  - {s: W_actual, fa: "مصرف واقعی دوره", u: "m3", k: m, p: volume}
  - {s: W_base_ref, fa: "خط مبنا در شرایط مرجع (تولید و دمای استاندارد)", u: "m3", k: d, from: [FRM-07-001, FRM-07-002]}
  - {s: W_base_act, fa: "خط مبنا در شرایط واقعی دوره", u: "m3", k: d, from: [FRM-07-001, FRM-07-002]}
  res: {s: W_norm, fa: "مصرف نرمال‌شده", u: "m3"}
  valid: "شرایط مرجع (تولید و دما) از ابتدا تعریف و ثابت شود. فقط در محدوده‌ی اعتبار مدل."
  err: "برای مقایسه‌ی دوره‌ها و مجتمع‌ها با شرایط متفاوت به کار می‌رود، نه برای گزارش مصرف واقعی."
- id: FRM-07-012
  fa: "سهم مصرف ثابت از کل مصرف"
  en: "Fixed consumption share"
  expr: "FS = b0 / W_total * 100"
  vars:
  - {s: b0, fa: "مصرف ثابت مدل (عرض از مبدأ)", u: "m3", k: c}
  - {s: W_total, fa: "کل مصرف دوره", u: "m3", k: m, p: volume}
  res: {s: FS, fa: "سهم مصرف ثابت", u: "%"}
  valid: "b0 معنادار آماری و مثبت باشد. برای دوره‌ی هم‌طول با دوره‌ی مبنا."
  err: "سهم ثابت بالا فرصت کاهش مصرف در زمان توقف و کم‌باری است (مقایسه با جریان پایه FRM-04-006)."
- id: FRM-07-013
  fa: "مجموع تجمعی صرفه‌جویی (CUSUM)"
  en: "Cumulative sum of savings (CUSUM)"
  expr: "CUSUM_t = sum(W_adj_i - W_actual_i)"
  vars:
  - {s: W_adj_i, fa: "خط مبنای تعدیل‌شده‌ی دوره‌ی i", u: "m3", k: d, from: [FRM-07-003]}
  - {s: W_actual_i, fa: "مصرف واقعی دوره‌ی i", u: "m3", k: m, p: volume}
  res: {s: CUSUM_t, fa: "مجموع تجمعی تا دوره‌ی t", u: "m3"}
  valid: "جمع از شروع دوره‌ی گزارش‌دهی و با مدل ثابت. تغییر شیب نمودار نشانه‌ی تغییر عملکرد است."
  err: "تغییر مدل در میانه‌ی دوره، نمودار را بی‌معنی می‌کند و باید ثبت شود."
