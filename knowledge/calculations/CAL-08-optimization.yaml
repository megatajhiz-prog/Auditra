engine: CAL-08
defaults: {lvl: [site, process], eq: [ALL], status: expert_reviewed, reviewed_by: "CEP", reviewed_on: "2026-11-11"}
records:
- id: FRM-08-001
  fa: "تابع هدف هزینه‌ی تأمین آب در تخصیص بهینه"
  en: "Water supply cost objective for optimal allocation"
  expr: "Z = sum(C_i * F_i)"
  vars:
  - {s: C_i, fa: "هزینه‌ی واحد آب منبع i (شامل برداشت، تصفیه و انتقال)", u: "currency/m3", k: c}
  - {s: F_i, fa: "دبی تخصیص‌یافته از منبع i (متغیر تصمیم)", u: "m3/h", k: d}
  res: {s: Z, fa: "هزینه‌ی تأمین آب (کمینه می‌شود)", u: "currency/h"}
  valid: "هزینه‌ی واحد همه‌ی منابع در یک مبنا و یک واحد پول باشد. هزینه‌ی تصفیه‌ی لازم برای رسیدن به کیفیت هم در C_i لحاظ شود."
  err: "برای ورود هزینه‌ی تصفیه، انتخاب فناوری و خطوط انتقال، مدل به MILP یا MINLP گسترش می‌یابد (مرحله‌ی پیشرفته)."
  ref: [M2-4.5]
- id: FRM-08-002
  fa: "قید تأمین تقاضای مصرف‌کننده‌ها"
  en: "Consumer demand constraint"
  expr: "ok_demand = (sum(X_ij) >= D_j)"
  vars:
  - {s: X_ij, fa: "دبی منتقل‌شده از منبع i به مصرف‌کننده‌ی j (متغیر تصمیم)", u: "m3/h", k: d}
  - {s: D_j, fa: "تقاضای مصرف‌کننده‌ی j", u: "m3/h", k: m, p: flow_rate}
  res: {s: ok_demand, fa: "قید تقاضا برقرار است (درست/نادرست)", u: "-"}
  valid: "برای هر مصرف‌کننده‌ی j جداگانه نوشته می‌شود. تقاضا باید از موازنه‌ی فرآیند یا خط مبنا (CAL-07) باشد، نه مصرف هدررفته‌ی فعلی."
  err: "اگر مصرف فعلی شامل اتلاف است، تقاضای واقعی را از مصرف مفید (FRM-03-013) بگیرید."
  ref: [M2-4.5]
- id: FRM-08-003
  fa: "قید ظرفیت منابع"
  en: "Source capacity constraint"
  expr: "ok_capacity = (sum(X_ij) <= S_i)"
  vars:
  - {s: X_ij, fa: "دبی منتقل‌شده از منبع i به مصرف‌کننده‌ی j (متغیر تصمیم)", u: "m3/h", k: d}
  - {s: S_i, fa: "ظرفیت منبع i (حداکثر دبی در دسترس یا مجاز)", u: "m3/h", k: c}
  res: {s: ok_capacity, fa: "قید ظرفیت برقرار است (درست/نادرست)", u: "-"}
  valid: "برای هر منبع i جداگانه. ظرفیت مجاز برداشت یا ظرفیت واحد تصفیه و تأمین‌کننده را بگیرید."
  err: "ظرفیت‌های فصلی (مثلاً کاهش برداشت چاه در تابستان) را جداگانه تعریف کنید."
  ref: [M2-4.5]
- id: FRM-08-004
  fa: "غلظت آلاینده در جریان مخلوط ورودی به مصرف‌کننده"
  en: "Contaminant concentration in the mixed stream to a consumer"
  expr: "c_mix = sum(X_ij * c_i) / sum(X_ij)"
  vars:
  - {s: X_ij, fa: "دبی منبع i به مصرف‌کننده‌ی j", u: "m3/h", k: d}
  - {s: c_i, fa: "غلظت آلاینده در منبع i", u: "mg/L", k: m, p: tds}
  res: {s: c_mix, fa: "غلظت مخلوط", u: "mg/L"}
  valid: "برای پارامترهای پایستار (TDS و املاح). برای هر آلاینده جداگانه. پارامتر TDS نمونه است."
  err: "برای pH و پارامترهای واکنشی، موازنه‌ی شیمیایی لازم است."
  ref: [M2-4.5]
- id: FRM-08-005
  fa: "قید کیفیت آب ورودی هر مصرف‌کننده"
  en: "Inlet water quality constraint per consumer"
  expr: "ok_quality = (c_mix <= c_max_j)"
  vars:
  - {s: c_mix, fa: "غلظت آلاینده در مخلوط ورودی", u: "mg/L", k: d, from: [FRM-08-004]}
  - {s: c_max_j, fa: "حداکثر غلظت مجاز آلاینده در ورودی مصرف‌کننده‌ی j", u: "mg/L", k: c}
  res: {s: ok_quality, fa: "قید کیفیت برقرار است (درست/نادرست)", u: "-"}
  valid: "برای هر آلاینده قید مستقل نوشته شود و همه باید هم‌زمان برقرار باشند. حد از «کاربرد مجاز» بانک جریان‌ها بیاید."
  err: "حد مجاز بدون مبنای مکتوب، نتیجه‌ی بهینه‌سازی را غیرقابل‌اتکا می‌کند."
  ref: [M2-4.5]
- id: FRM-08-006
  fa: "بار جرمی آلاینده‌ی منتقل‌شده در یک فرآیند"
  en: "Contaminant mass load transferred in a process"
  expr: "dm = F * (c_out - c_in) / 1000"
  vars:
  - {s: F, fa: "دبی آب فرآیند", u: "m3/h", k: m, p: flow_rate}
  - {s: c_out, fa: "غلظت آلاینده در خروجی فرآیند", u: "mg/L", k: m, p: tds}
  - {s: c_in, fa: "غلظت آلاینده در ورودی فرآیند", u: "mg/L", k: m, p: tds}
  res: {s: dm, fa: "بار جرمی منتقل‌شده", u: "kg/h"}
  valid: "mg/L برابر g/m3 است. فرض: انتقال جرم آلاینده فقط از طریق آب فرآیند و بدون تلفات آب."
  err: "برای فرآیندهای با تبخیر یا تغییر دبی، دبی ورودی و خروجی جدا لحاظ شود."
- id: FRM-08-007
  fa: "دبی حدی (کمینه‌ی آب مورد نیاز) یک فرآیند"
  en: "Limiting water flow of a process"
  expr: "F_lim = dm * 1000 / (c_out_max - c_s)"
  vars:
  - {s: dm, fa: "بار جرمی آلاینده‌ی فرآیند", u: "kg/h", k: d, from: [FRM-08-006]}
  - {s: c_out_max, fa: "حداکثر غلظت مجاز خروجی فرآیند", u: "mg/L", k: c}
  - {s: c_s, fa: "غلظت آلاینده در آب تأمین‌کننده", u: "mg/L", k: m, p: tds}
  res: {s: F_lim, fa: "دبی حدی", u: "m3/h"}
  valid: "c_out_max بزرگ‌تر از c_s. یک آلاینده‌ی کلیدی در هر بار. فرآیندهای انتقال جرم‌محور."
  err: "دبی حدی کمینه‌ی نظری است. محدودیت‌های عملیاتی و هیدرولیکی مقدار واقعی را بالاتر می‌برند."
  note: "روش‌شناسی (بخش ۴٫۵) Water Pinch را معرفی کرده ولی رابطه‌ی دبی حدی را نداده است. این رابطه‌ی استاندارد روش بار جرمی است."
- id: FRM-08-008
  fa: "امکان‌سنجی استفاده‌ی مجدد مستقیم پساب یک فرآیند در فرآیند دیگر"
  en: "Feasibility of direct reuse of one process effluent in another"
  expr: "feasible = all(c_src_k <= c_in_max_k) and F_src >= F_dem"
  vars:
  - {s: c_src_k, fa: "غلظت آلاینده‌ی k در جریان مبدأ", u: "mg/L", k: m, p: tds}
  - {s: c_in_max_k, fa: "حداکثر غلظت مجاز آلاینده‌ی k در ورودی مقصد", u: "mg/L", k: c}
  - {s: F_src, fa: "دبی در دسترس جریان مبدأ", u: "m3/h", k: m, p: flow_rate}
  - {s: F_dem, fa: "دبی مورد نیاز مقصد", u: "m3/h", k: m, p: flow_rate}
  res: {s: feasible, fa: "استفاده‌ی مجدد مستقیم شدنی است (درست/نادرست)", u: "-"}
  valid: "برای همه‌ی آلاینده‌های مهم مقصد (املاح، pH، دما، روغن و غیره). هماهنگی زمانی تولید پساب و مصرف و محدودیت‌های هیدرولیکی بررسی شود."
  err: "پارامتر بدون داده «نامشخص» است، نه مجاز. ریسک آلودگی محصول یا تجهیز را کارشناس ارزیابی کند."
- id: FRM-08-009
  fa: "هزینه‌ی واحد آب مخلوط"
  en: "Unit cost of blended water"
  expr: "C_mix = sum(F_i * C_i) / sum(F_i)"
  vars:
  - {s: F_i, fa: "دبی منبع i در ترکیب", u: "m3/h", k: m, p: flow_rate}
  - {s: C_i, fa: "هزینه‌ی واحد منبع i", u: "currency/m3", k: c}
  res: {s: C_mix, fa: "هزینه‌ی واحد آب مخلوط", u: "currency/m3"}
  valid: "هزینه‌ها هم‌مبنا و هم‌واحد پول."
  err: "هزینه‌ی انتقال و تصفیه‌ی اختصاصی هر منبع در C_i لحاظ شود."
- id: FRM-08-010
  fa: "صرفه‌جویی آب جبرانی با بالا بردن دور تغلیظ برج"
  en: "Make-up water saving from raising the cycles of concentration"
  expr: "dM = E * (1 / (COC1 - 1) - 1 / (COC2 - 1))"
  vars:
  - {s: E, fa: "دبی تبخیر برج", u: "m3/h", k: d, from: [FRM-02-010]}
  - {s: COC1, fa: "دور تغلیظ فعلی", u: "-", k: d, from: [FRM-06-007, FRM-06-008, FRM-06-009]}
  - {s: COC2, fa: "دور تغلیظ هدف", u: "-", k: c}
  res: {s: dM, fa: "کاهش آب جبرانی", u: "m3/h"}
  valid: "تبخیر و دریفت ثابت. COC1 و COC2 بزرگ‌تر از ۱. COC2 باید با حد رسوب و خوردگی (FRM-06-010 و FRM-05-011) و برنامه‌ی تصفیه‌ی شیمیایی مجاز باشد."
  err: "بالا بردن COC رسوب و خوردگی را بیشتر می‌کند. هزینه‌ی مواد شیمیایی بیشتر و ریسک تجهیز را در تحلیل اقتصادی لحاظ کنید."
  lvl: [equipment]
  eq: [cooling_tower, closed_circuit_tower, hybrid_tower, evaporative_condenser]
- id: FRM-08-011
  fa: "کاهش آب جبرانی بویلر با افزایش بازگشت کندانس"
  en: "Boiler make-up saving from higher condensate return"
  expr: "dM_b = m_s * (CR2 - CR1) / 100"
  vars:
  - {s: m_s, fa: "بخار تولیدی", u: "t/h", k: m, p: steam_flow}
  - {s: CR1, fa: "نسبت بازگشت فعلی", u: "%", k: d, from: [FRM-02-014]}
  - {s: CR2, fa: "نسبت بازگشت هدف", u: "%", k: c}
  res: {s: dM_b, fa: "کاهش آب جبرانی", u: "m3/h"}
  valid: "بخار تولیدی ثابت. هر تن برای آب مایع تقریباً برابر یک مترمکعب. CR2 بیش از ۱۰۰ نشود و کیفیت کندانس باز‌گشتی مناسب باشد."
  err: "صرفه‌جویی انرژی (گرمای کندانس) هم دارد که جدا حساب می‌شود. هزینه‌ی خط بازگشت و پالایش کندانس در تحلیل اقتصادی بیاید."
  lvl: [equipment]
  eq: [boiler, condensate_return, steam_trap, condensate_polisher]
- id: FRM-08-012
  fa: "کاهش آب خوراک RO با افزایش بازیابی"
  en: "RO feed water saving from higher recovery"
  expr: "dQ_f = Q_p * (100 / Rec1 - 100 / Rec2)"
  vars:
  - {s: Q_p, fa: "دبی آب تولیدی (ثابت)", u: "m3/h", k: m, p: flow_rate}
  - {s: Rec1, fa: "بازیابی فعلی", u: "%", k: d, from: [FRM-06-014]}
  - {s: Rec2, fa: "بازیابی هدف", u: "%", k: c}
  res: {s: dQ_f, fa: "کاهش دبی خوراک", u: "m3/h"}
  valid: "دبی پرمیت ثابت. Rec2 باید از حد رسوب‌گذاری املاح، فشار کاری مجاز و ضریب تغلیظ (FRM-06-016) مجاز باشد."
  err: "افزایش بازیابی بدون بررسی رسوب‌گذاری ممنوع است. مصرف انرژی ویژه و هزینه‌ی شست‌وشو در تحلیل اقتصادی لحاظ شود."
  lvl: [equipment]
  eq: [reverse_osmosis, nanofiltration]
- id: FRM-08-013
  fa: "نسبت اختلاط دو جریان برای رسیدن به حد مجاز"
  en: "Blending ratio of two streams to meet a limit"
  expr: "x = (c_max - c_B) / (c_A - c_B)"
  vars:
  - {s: c_max, fa: "حد مجاز مخلوط", u: "mg/L", k: c}
  - {s: c_B, fa: "غلظت جریان کم‌غلظت (آب با کیفیت بهتر)", u: "mg/L", k: m, p: tds}
  - {s: c_A, fa: "غلظت جریان پرغلظت (پساب یا آب شور)", u: "mg/L", k: m, p: tds}
  res: {s: x, fa: "بیشینه‌ی سهم جریان پرغلظت در مخلوط", u: "-"}
  valid: "c_A بزرگ‌تر از c_B و c_max بین دو غلظت. برای پارامترهای پایستار. نتیجه باید بین ۰ و ۱ باشد."
  err: "اگر x منفی یا بیشتر از ۱ شد، اختلاط به‌تنهایی راه‌حل نیست."
- id: FRM-08-014
  fa: "راندمان حذف لازم برای قابل‌استفاده شدن یک جریان"
  en: "Required removal efficiency to make a stream usable"
  expr: "eta_req = (c_in - c_max) / c_in * 100"
  vars:
  - {s: c_in, fa: "غلظت آلاینده‌ی جریان قبل از تصفیه", u: "mg/L", k: m, p: tds}
  - {s: c_max, fa: "حداکثر غلظت مجاز برای کاربرد مقصد", u: "mg/L", k: c}
  res: {s: eta_req, fa: "راندمان حذف لازم", u: "%"}
  valid: "c_in بزرگ‌تر از c_max. برای هر آلاینده جداگانه و بیشینه‌ی آن‌ها ملاک است."
  err: "راندمان لازم را با راندمان واقعی فناوری (FRM-05-001) مقایسه کنید و حاشیه‌ی اطمینان بگذارید."
