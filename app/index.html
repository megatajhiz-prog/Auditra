:root{--ink:#0F2A3D;--mut:#40525F;--pri:#0E7490;--bg:#F4F7FA;--line:#DDE6EC}
*{box-sizing:border-box}body{margin:0;font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{max-width:1120px;margin:0 auto;padding:12px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.logo{height:44px;width:auto;display:block}nav{display:flex;gap:6px;flex:1;flex-wrap:wrap}
nav button{font:inherit;border:0;background:none;padding:10px 16px;border-radius:999px;color:var(--mut);cursor:pointer;min-height:44px}nav button.on{background:var(--pri);color:#fff}
.tools{display:flex;gap:8px}select,input,textarea{font:inherit;padding:10px 12px;border:1px solid #8FA3B1;border-radius:10px;background:#fff;color:var(--ink);min-height:44px}
main{max-width:1120px;margin:0 auto;padding:24px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;color:var(--mut);cursor:pointer}.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.c{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.h{display:flex;justify-content:space-between;gap:8px}.id{font-size:12px;color:var(--mut);direction:ltr}.m{font-size:13px;color:var(--mut)}
.t{display:inline-block;background:#E8F4F7;color:#0B4F63;border-radius:8px;padding:2px 8px;font-size:12px;margin:2px}.ok{background:#E3F5EA;color:#14532D}
details{font-size:13px;line-height:1.8}summary{cursor:pointer;color:var(--pri);min-height:32px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:20px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}
.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.b{font:inherit;padding:10px 24px;border-radius:10px;border:0;background:var(--pri);color:#fff;cursor:pointer;min-height:44px}.b.o{background:#fff;color:var(--pri);border:1px solid var(--pri)}
.st{display:inline-block;padding:6px 14px;border-radius:999px;background:#E3EBF1;color:var(--mut);font-size:13px;margin:2px}.st.on{background:var(--pri);color:#fff}

حیطی) جداگانه گزارش شوند.", "l": ["site", "process", "equipment"], "rv": true}, {"id": "FRM-09-014", "e": "CAL-09", "fa": "جریان نقدی سال t با افزایش سالانه‌ی قیمت", "en": "Cash flow in year t with annual price escalation", "x": "CF_t = CF_1 * (1 + g)^(t - 1)", "v": [{"s": "CF_1", "fa": "جریان نقدی خالص سال اول", "u": "currency", "k": "d"}, {"s": "g", "fa": "نرخ افزایش سالانه‌ی قیمت آب و انرژی", "u": "1/year", "k": "c"}, {"s": "t", "fa": "شماره‌ی سال", "u": "year", "k": "c"}], "r": {"s": "CF_t", "fa": "جریان نقدی سال t", "u": "currency"}, "va": "نرخ رشد قیمت با مبنای مکتوب. فرض رشد یکنواخت و ثابت بودن حجم صرفه‌جویی.", "er": "رشد خیلی بالا نتیجه‌ی خوش‌بینانه می‌دهد. حساسیت روی g بررسی شود.", "l": ["site", "process", "equipment"], "rv": true}, {"id": "FRM-09-015", "e": "CAL-09", "fa": "امتیاز وزنی راهکار (رتبه‌بندی چندمعیاره)", "en": "Weighted score of a solution (multi-criteria ranking)", "x": "Score = sum(w_k * x_k)", "v": [{"s": "w_k", "fa": "وزن معیار k (جمع وزن‌ها برابر ۱)", "u": "-", "k": "c"}, {"s": "x_k", "fa": "امتیاز نرمال‌شده‌ی راهکار در معیار k (۰ تا ۱)", "u": "-", "k": "c"}], "r": {"s": "Score", "fa": "امتیاز راهکار", "u": "-"}, "va": "معیارها: صرفه‌جویی آب، هزینه‌ی سرمایه‌گذاری، زمان بازگشت، سهولت اجرا، کاهش ریسک تأمین، اثر زیست‌محیطی. وزن‌ها با تأیید ذی‌نفعان و مبنای مکتوب.", "er": "معیارهای هزینه و ریسک پیش از ترکیب معکوس‌سازی شوند تا «بیشتر بهتر» باشد.", "l": ["site", "process", "equipment"], "rv": true}, {"id": "FRM-09-016", "e": "CAL-09", "fa": "فاصله‌ی راهکار از جواب ایده‌آل یا ضدایده‌آل (TOPSIS)", "en": "Distance of a solution from the ideal or anti-ideal (TOPSIS)", "x": "d = sqrt(sum((v_j - v_ref_j)^2))", "v": [{"s": "v_j", "fa": "امتیاز وزن‌دار نرمال‌شده‌ی راهکار در معیار j", "u": "-", "k": "c"}, {"s": "v_ref_j", "fa": "امتیاز مرجع (بهترین یا بدترین) معیار j", "u": "-", "k": "c"}], "r": {"s": "d", "fa": "فاصله", "u": "-"}, "va": "یک بار با مرجع بهترین (d_plus) و یک بار با مرجع بدترین (d_minus) محاسبه می‌شود. ماتریس تصمیم نرمال و وزن‌دار شود.", "er": "نتیجه به وزن‌ها حساس است. تحلیل حساسیت روی وزن‌ها انجام شود.", "l": ["site", "process", "equipment"], "rv": true}, {"id": "FRM-09-017", "e": "CAL-09", "fa": "ضریب نزدیکی به جواب ایده‌آل (TOPSIS)", "en": "TOPSIS closeness coefficient", "x": "CC = d_minus / (d_plus + d_minus)", "v": [{"s": "d_plus", "fa": "فاصله از جواب ایده‌آل", "u": "-", "k": "d"}, {"s": "d_minus", "fa": "فاصله از جواب ضدایده‌آل", "u": "-", "k": "d"}], "r": {"s": "CC", "fa": "ضریب نزدیکی", "u": "-"}, "va": "d_plus و d_minus همزمان صفر نباشند. هرچه CC بزرگ‌تر، راهکار بهتر.", "er": "رتبه‌بندی فقط ترتیب را می‌گوید و مقدار صرفه‌جویی را نمی‌دهد. با NPV و ریسک اجرایی کنار هم دیده شود.", "l": ["site", "process", "equipment"], "rv": true}, {"id": "FRM-09-018", "e": "CAL-09", "fa": "دامنه‌ی تغییر NPV در تحلیل حساسیت (عرض نمودار تورنادو)", "en": "NPV swing in sensitivity analysis (tornado width)", "x": "Swing = abs(NPV_high - NPV_low)", "v": [{"s": "NPV_high", "fa": "NPV با مقدار بالای متغیر (بقیه در مقدار پایه)", "u": "currency", "k": "d"}, {"s": "NPV_low", "fa": "NPV با مقدار پایین متغیر (بقیه در مقدار پایه)", "u": "currency", "k": "d"}], "r": {"s": "Swing", "fa": "دامنه‌ی تغییر NPV", "u": "currency"}, "va": "هر متغیر جداگانه و با بازه‌ی مکتوب (کمینه و بیشینه) تغییر کند. بازه‌ها قابل‌مقایسه و واقع‌بینانه باشند.", "er": "این روش فقط اثر تک‌متغیره را نشان می‌دهد. اثر هم‌زمان و وابستگی متغیرها در تحلیل مونت‌کارلو (FRM-09-024 تا FRM-09-029) بررسی می‌شود.", "l": ["site", "process", "equipment"], "rv": true}, {"id": "FRM-09-019", "e": "CAL-09", "fa": "کشش NPV نسبت به یک متغیر ورودی", "en": "Elasticity of NPV with respect to an input", "x": "El = ((NPV_1 - NPV_0) / NPV_0) / ((x_1 - x_0) / x_0)", "v": [{"s": "NPV_0", "fa": "NPV در مقدار پایه", "u": "currency", "k": "d"}, {"s": "NPV_1", "fa": "NPV پس از تغییر کوچک متغیر", "u": "currency", "k": "d"}, {"s": "x_0", "fa": "مقدار پایه‌ی متغیر", "u": "-", "k": "c"}, {"s": "x_1", "fa": "مقدار تغییر‌یافته‌ی متغیر", "u": "-", "k": "c"}], "r": {"s": "El", "fa": "کشش", " return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${es("tor")}" style="direction:ltr">${rs.map((r,i)=>{const y=14+i*30,a=Math.min(r.lo,r.hi),b=Math.max(r.lo,r.hi);return `<text x="${L-8}" y="${y+14}" text-anchor="end" font-size="12" fill="#0F2A3D">${esc(lb(r.l).replace(/ \(.*\)/,""))}</text><rect x="${x(a)}" y="${y}" width="${Math.max(1,x(S.m0)-x(a))}" height="20" fill="${C2}"/><rect x="${x(S.m0)}" y="${y}" width="${Math.max(1,x(b)-x(S.m0))}" height="20" fill="${C1}"/>`}).join("")}<line x1="${x(S.m0)}" y1="6" x2="${x(S.m0)}" y2="${H-18}" stroke="#0F2A3D"/><text x="${x(S.m0)}" y="${H-4}" text-anchor="middle" font-size="11">${fm(S.m0)}</text><text x="${L}" y="${H-4}" font-size="11">${fm(mi)}</text><text x="${W-20}" y="${H-4}" text-anchor="end" font-size="11">${fm(ma)}</text></svg>`}
function svgH(R){const bn=30,mi=R.s[0],ma=R.s[R.N-1],bw=(ma-mi)/bn||1,c=Array(bn).fill(0);R.out.forEach(v=>c[Math.min(bn-1,Math.floor((v-mi)/bw))]++);const mx=Math.max(...c),Wd=W-40,H=230,X=v=>20+(v-mi)/(ma-mi||1)*Wd,y=n=>190-n/mx*170;
return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${es("hist")}" style="direction:ltr">${c.map((n,i)=>{const a=mi+i*bw;return `<rect x="${X(a)}" y="${y(n)}" width="${Math.max(1,Wd/bn-1)}" height="${190-y(n)}" fill="${a+bw/2<0?C3:C1}"/>`}).join("")}<line x1="20" y1="190" x2="${W-20}" y2="190" stroke="${GR}"/>${mi<0&&ma>0?`<line x1="${X(0)}" y1="10" x2="${X(0)}" y2="190" stroke="#0F2A3D" stroke-dasharray="4"/><text x="${X(0)}" y="205" text-anchor="middle" font-size="11">0</text>`:""}<line x1="${X(R.mean)}" y1="10" x2="${X(R.mean)}" y2="190" stroke="${C2}"/><text x="20" y="218" font-size="11">${fm(mi)}</text><text x="${W-20}" y="218" text-anchor="end" font-size="11">${fm(ma)}</text></svg>`}
function svgS(R){const mi=R.s[0],ma=R.s[R.N-1],Wd=W-40,X=v=>20+(v-mi)/(ma-mi||1)*Wd,y=p=>190-p*170,pts=[];for(let i=0;i<=100;i++){const v=R.s[Math.min(R.N-1,Math.floor(i/100*R.N))];pts.push(X(v)+","+y(i/100))}
return `<svg viewBox="0 0 ${W} 230" width="100%" role="img" aria-label="${es("scv")}" style="direction:ltr"><line x1="20" y1="190" x2="${W-20}" y2="190" stroke="${GR}"/><line x1="20" y1="20" x2="20" y2="190" stroke="${GR}"/><polyline points="${pts.join(" ")}" fill="none" stroke="${C1}" stroke-width="2.5"/>${mi<0&&ma>0?`<line x1="${X(0)}" y1="${y(R.pl)}" x2="${X(0)}" y2="190" stroke="${C3}" stroke-dasharray="4"/><line x1="20" y1="${y(R.pl)}" x2="${X(0)}" y2="${y(R.pl)}" stroke="${C3}" stroke-dasharray="4"/><text x="26" y="${y(R.pl)-5}" font-size="11" fill="${C3}">${fm(R.pl*100,1)}%</text>`:""}<text x="20" y="214" font-size="11">${fm(mi)}</text><text x="${W-20}" y="214" text-anchor="end" font-size="11">${fm(ma)}</text><text x="8" y="24" font-size="11">1</text></svg>`}
function svgC(cf,cap){const v=[-cap,...cf.map(c=>c.cum)],mi=Math.min(...v),ma=Math.max(...v),Wd=W-40,X=i=>20+i/(v.length-1||1)*Wd,y=a=>190-(a-mi)/((ma-mi)||1)*170,z=y(0);return `<svg viewBox="0 0 ${W} 215" width="100%" role="img" aria-label="${es("cf")}" style="direction:ltr"><line x1="20" y1="${z}" x2="${W-20}" y2="${z}" stroke="${GR}" stroke-dasharray="4"/><polyline points="${v.map((a,i)=>X(i)+","+y(a)).join(" ")}" fill="none" stroke="${C1}" stroke-width="2.5"/>${v.map((a,i)=>`<circle cx="${X(i)}" cy="${y(a)}" r="3" fill="${a<0?C3:C1}"/>`).join("")}<text x="20" y="210" font-size="11">0</text><text x="${W-20}" y="210" text-anchor="end" font-size="11">${v.length-1}</text></svg>`}
const tb=(h,rows)=>`<div style="overflow-x:auto"><table class="tb"><thead><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
const kp=(l,v)=>`<div class="kc"><span>${l}</span><b>${v}</b></div>`;
function eco(){const P=EC.pg,B=base(),pg=[0,1,2,3].map(i=>`<button class="st${i===P?" on":""}" data-ea="pg" data-v="${i}" style="border:0;font:inherit;cursor:pointer">${i+1}. ${es("p"+i)}</button>`).join(""),nav=`<div class="row">${P?`<button class="b o" data-ea="pg" data-v="${P-1}">${es("pv")}</button>`:"<span></span>"}${P<3?`<button class="b" data-ea="pg" data-v="${P+1}">${es("nx")}</button>`:""}</div>`;let h="";
if(P===0){h=`<p>${es("hint")}</p><div style="overflow-x:auto"><table class="tb"><thead><tr><th>${es("var")}</th><th>${es("b")}</th><th>${es("mn")}</th><th>${es("mx")}</th><th>${es("d")}</th></tr></thead><tbody>${EV.map(([k,l,u])=>{const v=EC.v[k]||{};return `<tr><td>${esc(lb(l))}<br><span class="id">${u}</span></td><td><input data-ev="${k}.b" value="${esc(v.b||"")}" inputmode="decimal" style="width:120px"></td><td><input data-ev="${k}.mn" value="${esc(v.mn||"")}" inputmode="decimal" style="width:110px"></td><td><input data-ev="${k}.mx" value="${esc(v.mx||"")}" inputmode="decimal" style="width:110px"></td><td><select data-ev="${k}.d">${[["tri","tri"],["uni","uni"],["nor","nor"]].map(o=>`<option value="${o[0]}"${(v.d||"tri")===o[0]?" selected":""}>${es(o[1])}</option>`).join("")}</select></td></tr>`}).join("")}</tbody></table></div><label>${es("n")}<input data-ev="n" value="${esc(EC.n)}" inputmode="numeric" style="max-width:160px"></label><div class="row"><span><button class="b o" data-ea="ex">${es("ex")}</button> <button class="b o" data-ea="clr">${es("clr")}</button></span></div><p class="msg">${EC.ex?es("exn"):""}</p>`}
else if(!B)h=`<p class="msg">${es("bad")}</p>`;
else if(P===1){const m=mdl(B.x,B.n);h=`<div class="k">${kp(es("npv"),fm(m.npv))}${kp(es("irr"),isFinite(m.irr)?fm(m.irr*100,1)+"%":"—")}${kp(es("pb"),fm(m.pb,1))}${kp(es("bcr"),fm(m.bcr,2))}${kp(es("lcc"),fm(m.lcc))}</div><h3>${es("cf")}</h3>${svgC(m.cf,B.x.capex)}${tb([es("y"),es("ben"),es("cost"),es("net"),es("disc"),es("cum")],m.cf.map(c=>[fm(c.t),fm(c.b),fm(c.c),fm(c.net),fm(c.dn),fm(c.cum)]))}`}
else if(P===2){const S=sens(B);h=`<h3>${es("tor")}</h3>${svgT(S)}<p>${S.dfl?es("dflt"):""}</p>${tb([es("rk"),es("var"),es("mn"),es("mx"),es("lo"),es("hi"),es("sw"),es("el")],S.rows.map(r=>[fm(r.rk),esc(lb(r.l)),fm(r.a,2),fm(r.b,2),fm(r.lo),fm(r.hi),fm(r.sw),fm(r.e,2)]))}`}
else{const R=EC.res;h=`<div class="g"><label>${es("N")}<input data-ev="N" value="${esc(EC.N)}" inputmode="numeric"></label><label>${es("seed")}<input data-ev="seed" value="${esc(EC.seed)}" inputmode="numeric"></label></div><div><button class="b" data-ea="run">${es("run")}</button></div>`;
if(!R)h+=`<p>${es("nrun")}</p>`;else if(R.err)h+=`<p class="msg">${es("one")}</p>`;else h+=`<div class="k">${kp(es("mean"),fm(R.mean))}${kp(es("p50"),fm(R.p50))}${kp(es("p5"),fm(R.p5))}${kp(es("p95"),fm(R.p95))}${kp(es("pl"),fm(R.pl*100,1)+"%")}${kp(es("vr"),fm(R.var5))}</div><h3>${es("hist")}</h3>${svgH(R)}<h3>${es("scv")}</h3>${svgS(R)}<h3>${es("cor")}</h3>${tb([es("rk"),es("var"),"ρ"],R.cor.map((c,i)=>[fm(i+1),esc(lb(EV.find(e=>e[0]===c.k)[1])),fm(c.rho,2)]))}${tb([es("mean"),es("sd"),es("se"),es("cv"),es("es"),es("N")],[[fm(R.mean),fm(R.sd),fm(R.se,1),fm(R.cv,2),fm(R.es),fm(R.N)]])}<p>${es("ass")}</p>`}
return `<div class="card"><div>${pg}</div><h2>${es("eco")}</h2>${h}${nav}</div>`}
function exm(){const d={capex:[3e6,2.7e6,3.9e6],vol:[30000,22000,34000],price:[40,30,48],opex:[150000,120000,220000],maint:[100000,80000,140000],r:[15,12,20],g:[5,2,8]};EC.v={};for(const k in d)EC.v[k]={b:String(d[k][0]),mn:String(d[k][1]),mx:String(d[k][2]),d:"tri"};EC.n="10";EC.ex=1;EC.res=null}
document.addEventListener("click",e=>{const b=e.target.closest("[data-ea]");if(!b)return;const a=b.dataset.ea;if(a==="pg")EC.pg=+b.dataset.v;else if(a==="ex")exm();else if(a==="clr"){EC.v={};EC.n="";EC.res=null;EC.ex=0}else if(a==="run"){const B=base();EC.res=B?mc(B):null}sE();draw()});
document.addEventListener("input",e=>{const x=e.target,k=x.dataset&&x.dataset.ev;if(!k)return;const[a,f]=k.split(".");if(a==="n")EC.n=x.value;else if(a==="N")EC.N=x.value;else if(a==="seed")EC.seed=x.value;else{(EC.v[a]=EC.v[a]||{})[f]=x.value;EC.res=null;EC.ex=0}sE()});


let CS={m:0,q:"",f:""};const cn=o=>lang==="fa"?o.fa:o.en,CM=mp(D.CE),FM=mp(D.F);
const LV={site:"مجتمع|Site",process:"فرآیند|Process",equipment:"تجهیز|Equipment"},PR={daily:"روزانه|Daily",monthly:"ماهانه|Monthly",yearly:"سالانه|Yearly"},DR={lower:"کمتر بهتر|Lower is better",higher:"بیشتر بهتر|Higher is better",target:"نزدیک به هدف|Close to target",monitor:"پایش|Monitor only"};
function calc(){const T=(a,b)=>lang==="fa"?a:b;return `<div><button class="chip${CS.m?"":" on"}" data-c="m" data-v="0">${T("فرمول‌ها","Formulas")} (${D.F.length})</button> <button class="chip${CS.m?" on":""}" data-c="m" data-v="1">${T("شاخص‌ها","Indicators")} (${D.K.length})</button></div><input id="cq" placeholder="${T("جستجوی نام، شناسه یا رابطه...","Search name, ID or expression...")}" value="${esc(CS.q)}" style="width:100%;max-width:420px;margin-top:12px"><div class="chips"><button class="chip${CS.f?"":" on"}" data-c="f" data-v="">${T("همه","All")}</button>${(CS.m?D.KG:D.CE).map(x=>`<button class="chip${CS.f===x.id?" on":""}" data-c="f" data-v="${x.id}">${esc(cn(x))}</button>`).join("")}</div><p id="cn"></p><div class="grid" id="cr"></div>`}
function cfill(){const T=(a,b)=>lang==="fa"?a:b,q=CS.q.toLowerCase(),mono='style="direction:ltr;text-align:left;font-family:Consolas,monospace;background:#F4F7FA;padding:8px;border-radius:8px;overflow-x:auto"';
const st=r=>`<span class="t ok">${r.rv?t("rv"):t("dr")}</span>`;let h;
if(!CS.m){const rs=D.F.filter(r=>(!CS.f||r.e===CS.f)&&(!q||(r.fa+" "+r.en+" "+r.id+" "+r.x).toLowerCase().includes(q)));$("#cn").textContent=rs.length+" "+t("cnt");
h=rs.map(r=>`<article class="c"><div class="h"><b>${esc(cn(r))}</b><span class="id">${r.id}</span></div><div class="m">${esc(cn(CM[r.e]))} · ${r.l.map(x=>esc(lb(LV[x]))).join("، ")}</div><div class="m" ${mono}>${esc(r.x)}</div><div>${st(r)}</div><details><summary>${T("متغیرها و توضیح","Variables and notes")}</summary>${r.v.map(v=>`<div class="m"><span class="id">${esc(v.s)}</span> ${esc(v.fa)} (${esc(v.u)})</div>`).join("")}<p><b>${T("نتیجه","Result")}:</b> ${esc(r.r.fa)} (${esc(r.r.u)})</p><p><b>${T("محدوده‌ی اعتبار","Validity")}:</b> ${esc(r.va)}</p><p><b>${T("کنترل خطا","Error control")}:</b> ${esc(r.er)}</p><div>${D.K.filter(k=>k.f.includes(r.id)).map(k=>`<span class="t">${k.id}</span>`).join("")}</div></details></article>`).join("")}
else{const rs=D.K.filter(r=>(!CS.f||r.g===CS.f)&&(!q||(r.fa+" "+r.en+" "+r.id).toLowerCase().includes(q)));$("#cn").textContent=rs.length+" "+t("cnt");
h=rs.map(r=>`<article class="c"><div class="h"><b>${esc(cn(r))}</b><span class="id">${r.id}</span></div><div class="m">${esc(cn(D.KG.find(g=>g.id===r.g)))} · ${r.l.map(x=>esc(lb(LV[x]))).join("، ")}</div>${r.f.map(f=>FM[f]?`<div class="m" ${mono}>${esc(FM[f].x)}</div>`:"").join("")}<div><span class="t">${esc(r.u)}</span>${r.p.map(x=>`<span class="t">${esc(lb(PR[x]))}</span>`).join("")}<span class="t">${esc(lb(DR[r.d]))}</span>${st(r)}</div><div class="m">${r.f.join("، ")}</div></article>`).join("")}
$("#cr").innerHTML=h}
document.addEventListener("click",e=>{const b=e.target.closest("[data-c]");if(!b)return;if(b.dataset.c==="m"){CS.m=+b.dataset.v;CS.f=""}else CS.f=b.dataset.v;draw()});
document.addEventListener("input",e=>{if(e.target.id==="cq"){CS.q=e.target.value;cfill()}});
draw();</script></body></html>
