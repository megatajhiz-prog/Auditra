details{font-size:13px;line-height:1.8}summary{cursor:pointer;color:var(--pri);min-height:32px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:20px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}

$("#r").innerHTML=rs.map(r=>`<article class="c"><div class="h"><b>${esc(nm(r))}</b><span class="id">${r.id}</span></div><div class="m">${esc(nm(M.S[r.sys]))} · ${r.role.map(x=>esc(nm(M.R[x]))).join("، ")}</div><div><span class="t ok">${r.rv?t("rv"):t("dr")}</span></div>${r.in.length?`<div class="m">${t("in")}: ${r.in.map(x=>tg(M.T,x)).join("")}</div>`:""}${r.out.length||r.fl.length?`<div class="m">${t("out")}: ${r.out.map(x=>tg(M.T,x)).join("")}${r.fl.map(x=>tg(M.X,x)).join("")}</div>`:""}<details><summary>${t("pa")}</summary>${r.pa.map(p=>`<span class="t">${esc(nm(M.P[p]))} (${esc(M.P[p].u)})</span>`).join("")}<p>${esc(r.no)}</p></details></article>`).join("")}
function prof(){const s=PS[si],rows=s.rep?(P[s.k]&&P[s.k].length?P[s.k]:(P[s.k]=[{}])):[P[s.k]=P[s.k]||{}];
const fld=(f,v,i)=>{let l=f[1]==="@yr"?t("yr")+" ("+t(cal)+")":lb(f[1]),h=`<label>${esc(l)}`,a=`data-f="${f[0]}" data-i="${i}"`;
if(f[2]==="#")h+=`<textarea rows="3" ${a}>${esc(v)}</textarea>`;else if(f[2]){const o=f[2]==="@I"?D.I.map(x=>[x.fa,x.en]):f[2].split(";").map(x=>x.split("|"));h+=`<select ${a}><option value=""></option>${o.map(x=>`<option value="${esc(x[0])}"${v===x[0]?" selected":""}>${esc(x[lang==="fa"?0:1])}</option>`).join("")}</select>`}else h+=`<input ${a} value="${esc(v)}">`;return h+"</label>"};
const body=rows.map((r,i)=>{const g=`<div class="g">${s.f.map(f=>fld(f,r[f[0]]||"",i)).join("")}</div>`;return s.rep?`<div class="rowc">${g}</div>`:g}).join("");
return `<div class="card"><div>${PS.map((x,i)=>`<span class="st${i===si?" on":""}">${i+1}. ${nm(x)}</span>`).join("")}</div><h2>${nm(s)}</h2>${body}${s.rep?`<div><button class="b o" data-a="ad">${t("ad")}</button></div>`:""}<div class="row">${si?`<button class="b o" data-a="pv">${t("pv")}</button>`:"<span></span>"}<button class="b" data-a="nx">${si<PS.length-1?t("nx"):t("sv")}</button></div>${note?`<p class="msg">${note}</p>`:""}${si===PS.length-1?`<div><button class="b o" data-a="dl">${t("dl")}</button></div>`:""}</div>`}
function about(){const n=D.E.length,r=D.E.filter(x=>x.rv).length;return `<div class="card"><h2>Auditra ${D.meta.v}</h2><p>${t("ab")}</p><p>${n} ${t("cnt")} · ${t("rvc")}: ${r} · ${t("sy")}: ${D.S.length}</p></div>`}
const sv=()=>localStorage.setItem("au_p",JSON.stringify(P));
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;note="";
if(a==="tab"){tab=b.dataset.v;si=0}else if(a==="sys")F.s=b.dataset.v;else if(a==="nx"){sv();if(si<PS.length-1)si++;else note=t("ok")}else if(a==="pv")si--;else if(a==="ad"){(P[PS[si].k]=P[PS[si].k]||[]).push({});sv()}
else if(a==="dl"){const u=URL.createObjectURL(new Blob([JSON.stringify(P,null,1)],{type:"application/json"})),k=document.createElement("a");k.href=u;k.download="auditra-profile.json";k.click();return}
draw()});
document.addEventListener("input",e=>{const x=e.target;if(x.id==="q"){F.q=x.value;fill();return}const f=x.dataset&&x.dataset.f;if(!f)return;const s=PS[si];if(s.rep)P[s.k][+x.dataset.i][f]=x.value;else P[s.k][f]=x.value;sv()});
document.addEventListener("change",e=>{const x=e.target;if(x.id==="fi"){F.i=x.value;fill()}else if(x.id==="lg"){lang=x.value;localStorage.setItem("au_lang",lang);draw()}else if(x.id==="cl"){cal=x.value;localStorage.setItem("au_cal",cal);draw()}});
draw();</script></body></html>
