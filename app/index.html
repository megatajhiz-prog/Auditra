:root{--ink:#0F2A3D;--mut:#40525F;--pri:#0E7490;--bg:#F4F7FA;--line:#DDE6EC}
*{box-sizing:border-box}body{margin:0;font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{max-width:1120px;margin:0 auto;padding:12px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.logo{height:44px;width:auto;display:block}nav{display:flex;gap:6px;flex:1;flex-wrap:wrap}
nav button{font:inherit;border:0;background:none;padding:10px 16px;border-radius:999px;color:var(--mut);cursor:pointer;min-height:44px}nav button.on{background:var(--pri);color:#fff}
.tools{display:flex;gap:8px}select,input,textarea{font:inherit;padding:10px 12px;border:1px solid #8FA3B1;border-radius:10px;background:#fff;color:var(--ink);min-height:44px}
main{max-width:1120px;margin:0 auto;padding:24px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;color:var(--mut);cursor:pointer}.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.c{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.h{display:flex;justify-content:space-between;gap:8px}.id{font-size:12px;color:var(--mut);direction:ltr}.m{font-size:13px;color:var(--mut)}
.t{display:inline-block;background:#E8F4F7;color:#0B4F63;border-radius:8px;padding:2px 8px;font-size:12px;margin:2px}.ok{background:#E3F5EA;color:#14532D}
details{font-size:13px;line-height:1.8}summary{cursor:pointer;color:var(--pri);min-height:32px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:20px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}
.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.b{font:inherit;padding:10px 24px;border-radius:10px;border:0;background:var(--pri);color:#fff;cursor:pointer;min-height:44px}.b.o{background:#fff;color:var(--pri);border:1px solid var(--pri)}
.st{display:inline-block;padding:6px 14px;border-radius:999px;background:#E3EBF1;color:var(--mut);font-size:13px;margin:2px}.st.on{background:var(--pri);color:#fff}
