:root{--ink:#0F2A3D;--mut:#40525F;--pri:#0E7490;--bg:#F4F7FA;--line:#DDE6EC}
*{box-sizing:border-box}body{margin:0;font-family:Vazirmatn,Tahoma,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{max-width:1120px;margin:0 auto;padding:12px 24px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.logo{height:44px;width:auto;display:block}nav{display:flex;gap:6px;flex:1;flex-wrap:wrap}
nav button{font:inherit;border:0;background:none;padding:10px 16px;border-radius:999px;color:var(--mut);cursor:pointer;min-height:44px}nav button.on{background:var(--pri);color:#fff}
.tools{display:flex;gap:8px}select,input,textarea{font:inherit;padding:10px 12px;border:1px solid #8FA3B1;border-radius:10px;background:#fff;color:var(--ink);min-height:44px}
main{max-width:1120px;margin:0 auto;padding:24px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;color:var(--mut);cursor:pointer}.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.c{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.h{display:flex;justify-content:space-between;gap:8px}.id{font-size:12px;color:var(--mut);direction:ltr}.m{font-size:13px;color:var(--mut)}
.t{display:inline-block;background:#E8F4F7;color:#0B4F63;border-radius:8px;padding:2px 8px;font-size:12px;margin:2px}.ok{background:#E3F5EA;color:#14532D}
details{font-size:13px;line-height:1.8}summary{cursor:pointer;color:var(--pri);min-height:32px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:20px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}
.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.b{font:inherit;padding:10px 24px;border-radius:10px;border:0;background:var(--pri);color:#fff;cursor:pointer;min-height:44px}.b.o{background:#fff;color:var(--pri);border:1px solid var(--pri)}
.st{display:inline-block;padding:6px 14px;border-radius:999px;background:#E3EBF1;color:var(--mut);font-size:13px;margin:2px}.st.on{background:var(--pri);color:#fff}

حیطی) جداگانه گزارش شوند.", "l": ["site", "process", "equipment"], "rv": true}, {"id": "FRM-09-014", "e": "CAL-09", "fa": "جریان نقدی سال t با افزایش سالانه‌ی قیمت", "en": "Cash flow in year t with annual price escalation", "x": "CF_t = CF_1 * (1 + g)^(t - 1)", "v": [{"s": "CF_1", "fa": "جریان نقدی خالص سال اول", "u": "currency", "k": "d"}, {"s": "g", "fa": "نرخ افزایش سالانه‌ی قیمت آب و انرژی", "u": "1/year", "k": "c"}, {"s": "t", "fa": "شماره‌ی سال", "u": "year", "k": "c"}], "r": {"s": "CF_t", "fa": "جریان نقدی سال t", "u": "currency"}, "va": "نرخ رشد قیمت با مبنای مکتوب. فرض رشد یکنواخت و ثابت بودن حجم صرفه‌جویی.", "er": "رشد خیلی بالا نتیجه‌ی خوش‌بینانه می‌دهد. حساسیت روی g بررسی شود.", "l": ["site", "process", "equipment"], "rv": true}, {"id": "FRM-09-015", "e": "CAL-09", "fa": "امتیاز وزنی راهکار (رتبه‌بندی چندمعیاره)", "en": "Weighted score of a solution (multi-criteria ranking)", "x": "Score = sum(w_k * x_k)", "v": [{"s": "w_k", "fa": "وزن معیار k (جمع وزن‌ها برابر ۱)", "u": "-", "k": "c"}, {"s": "x_k", "fa": "امتیاز نرمال‌شده‌ی راهکار در معیار k (۰ تا ۱)", "u": "-", "k": "c"}], "r": {"s": "Score", "fa": "امتیاز راهکار", "u": "-"}, "va": "معیارها: صرفه‌جویی آب، هزینه‌ی سرمایه‌گذاری، زمان بازگشت، سهولت اجرا، کاهش ریسک تأمین، اثر زیست‌محیطی. وزن‌ها با تأیید ذی‌نفعان و مبنای مکتوب.", "er": "معیارهای هزینه و ریسک پیش از ترکیب معکوس‌سازی شوند تا «بیشتر بهتر» باشد.", "l": ["site", "process", "equipment"], "rv": true}, {"id": "FRM-09-016", "e": "CAL-09", "fa": "فاصله‌ی راهکار از جواب ایده‌آل یا ضدایده‌آل (TOPSIS)", "en": "Distance of a solution from the ideal or anti-ideal (TOPSIS)", "x": "d = sqrt(sum((v_j - v_ref_j)^2))", "v": [{"s": "v_j", "fa": "امتیاز وزن‌دار نرمال‌شده‌ی راهکار در معیار j", "u": "-", "k": "c"}, {"s": "v_ref_j", "fa": "امتیاز مرجع (بهترین یا بدترین) معیار j", "u": "-", "k": "c"}], "r": {"s": "d", "fa": "فاصله", "u": "-"}, "va": "یک بار با مرجع بهترین (d_plus) و یک بار با مرجع بدترین (d_minus) محاسبه می‌شود. ماتریس تصمیم نرمال و وزن‌دار شود.", "er": "نتیجه به وزن‌ها حساس است. تحلیل حساسیت روی وزن‌ها انجام شود.", "l": ["site", "process", "equipment"], "rv": true}, {"id": "FRM-09-017", "e": "CAL-09", "fa": "ضریب نزدیکی به جواب ایده‌آل (TOPSIS)", "en": "TOPSIS closeness coefficient", "x": "CC = d_minus / (d_plus + d_minus)", "v": [{"s": "d_plus", "fa": "فاصله از جواب ایده‌آل", "u": "-", "k": "d"}, {"s": "d_minus", "fa": "فاصله از جواب ضدایده‌آل", "u": "-", "k": "d"}], "r": {"s": "CC", "fa": "ضریب نزدیکی", "u": "-"}, "va": "d_plus و d_minus همزمان صفر نباشند. هرچه CC بزرگ‌تر، راهکار بهتر.", "er": "رتبه‌بندی فقط ترتیب را می‌گوید و مقدار صرفه‌جویی را نمی‌دهد. با NPV و ریسک اجرایی کنار هم دیده شود.", "l": ["site", "process", "equipment"], "rv": true}, {"id": "FRM-09-018", "e": "CAL-09", "fa": "دامنه‌ی تغییر NPV در تحلیل حساسیت (عرض نمودار تورنادو)", "en": "NPV swing in sensitivity analysis (tornado width)", "x": "Swing = abs(NPV_high - NPV_low)", "v": [{"s": "NPV_high", "fa": "NPV با مقدار بالای متغیر (بقیه در مقدار پایه)", "u": "currency", "k": "d"}, {"s": "NPV_low", "fa": "NPV با مقدار پایین متغیر (بقیه در مقدار پایه)", "u": "currency", "k": "d"}], "r": {"s": "Swing", "fa": "دامنه‌ی تغییر NPV", "u": "currency"}, "va": "هر متغیر جداگانه و با بازه‌ی مکتوب (کمینه و بیشینه) تغییر کند. بازه‌ها قابل‌مقایسه و واقع‌بینانه باشند.", "er": "این روش فقط اثر تک‌متغیره را نشان می‌دهد. اثر هم‌زمان و وابستگی متغیرها در تحلیل مونت‌کارلو (FRM-09-024 تا FRM-09-029) بررسی می‌شود.", "l": ["site", "process", "equipment"], "rv": true}, {"id": "FRM-09-019", "e": "CAL-09", "fa": "کشش NPV نسبت به یک متغیر ورودی", "en": "Elasticity of NPV with respect to an input", "x": "El = ((NPV_1 - NPV_0) / NPV_0) / ((x_1 - x_0) / x_0)", "v": [{"s": "NPV_0", "fa": "NPV در مقدار پایه", "u": "currency", "k": "d"}, {"s": "NPV_1", "fa": "NPV پس از تغییر کوچک متغیر", "u": "currency", "k": "d"}, {"s": "x_0", "fa": "مقدار پایه‌ی متغیر", "u": "-", "k": "c"}, {"s": "x_1", "fa": "مقدار تغییر‌یافته‌ی متغیر", "u": "-", "k": "c"}], "r": {"s": "El", "fa": "کشش", " async function ingest(files){const SH={},pre=[];for(const f of files){const ext=(f.name.match(/\.([^.]+)$/)||[])[1]?.toLowerCase();try{if(ext==="xlsx"){const sh=await xlsxRead(await f.arrayBuffer());let any=false;for(const nm in sh){const k=keyOf(nm,false);if(!k)continue;any=true;if(SH[k])pre.push({s:"E",sh:k,row:0,fa:`برگه‌ی «${k}» بیش از یک بار آمده است`,en:`sheet "${k}" appears more than once`});else SH[k]=sh[nm]}if(!any)pre.push({s:"E",sh:f.name,row:0,fa:"هیچ برگه‌ی قابل‌شناسایی نیست",en:"no recognisable sheet in this file"})}
else if(ext==="csv"){const k=keyOf(f.name,true);if(!k)pre.push({s:"W",sh:f.name,row:0,fa:"نام فایل با هیچ برگه نمی‌خواند و نادیده گرفته شد (باید شامل site, units, nodes, streams, meters یا readings باشد)",en:"file name does not match any sheet and was ignored (it must contain site, units, nodes, streams, meters or readings)"});else if(SH[k])pre.push({s:"E",sh:k,row:0,fa:`فایل «${k}» بیش از یک بار آمده است`,en:`file "${k}" appears more than once`});else SH[k]=csvRows(new TextDecoder("utf-8").decode(await f.arrayBuffer()))}
else pre.push({s:"W",sh:f.name,row:0,fa:"فقط فایل xlsx و csv پذیرفته می‌شود",en:"only xlsx and csv files are accepted"})}catch(x){pre.push({s:"E",sh:f.name,row:0,fa:"فایل خوانده نشد: "+x.message,en:"could not read the file: "+x.message})}}
const r=build(SH);r.iss=pre.concat(r.iss);r.e+=pre.filter(x=>x.s==="E").length;r.w+=pre.filter(x=>x.s==="W").length;return r}


// ===== Plant model tab: import files, show issues, show the saved model =====
let MODEL=null,MR=null,MFl="";try{MODEL=JSON.parse(localStorage.getItem("au_model")||"null")}catch(e){}
const mT=(a,b)=>lang==="fa"?a:b,mtile=(l,v)=>`<div class="c"><span class="m">${l}</span><b style="font-size:22px">${v}</b></div>`,
mtbl=(h,rs)=>`<div style="overflow-x:auto"><table style="border-collapse:collapse;width:100%;font-size:14px"><tr>${h.map(x=>`<th style="text-align:start;padding:8px;border-bottom:2px solid var(--line)">${x}</th>`).join("")}</tr>${rs.map(r=>`<tr>${r.map(x=>`<td style="padding:8px;border-bottom:1px solid var(--line)">${x}</td>`).join("")}</tr>`).join("")}</table></div>`;
const mData=b=>"data:application/octet-stream;base64,"+b;
function mres(R){const T=mT,sh=R.iss.filter(x=>!MFl||x.s===MFl).slice(0,300);
return `<h3 style="margin:0">${T("نتیجه‌ی خواندن فایل","File check result")}</h3><div class="g">${mtile(T("خطا","Errors"),R.e)}${mtile(T("هشدار","Warnings"),R.w)}</div>
<p class="${R.e?"":"msg"}">${R.e?T("خطا دارد، پس مدل ذخیره نشد. خطاها را اصلاح و فایل را دوباره انتخاب کنید.","There are errors, so the model was not saved. Fix them and choose the files again."):T("بدون خطا؛ مدل ذخیره شد.","No errors; the model was saved.")}</p>
${R.iss.length?`<div>${[["",T("همه","All")],["E",T("خطا","Errors")],["W",T("هشدار","Warnings")]].map(x=>`<button class="chip${MFl===x[0]?" on":""}" data-m="f" data-v="${x[0]}">${x[1]}</button>`).join("")}</div>${mtbl([T("نوع","Type"),T("برگه","Sheet"),T("سطر","Row"),T("پیام","Message")],sh.map(x=>[x.s==="E"?"❌":"⚠️",esc(x.sh),x.row||"",esc(lang==="fa"?x.fa:x.en)]))}${R.iss.length>300?`<p>${T("فقط ۳۰۰ مورد اول نشان داده شد.","Only the first 300 are shown.")}</p>`:""}`:""}`}
function mview(M){const T=mT,nm=Object.fromEntries(M.nodes.map(x=>[x.id,x.name])),ty=Object.fromEntries(D.T.map(x=>[x.id,cn(x)])),pr=Object.fromEntries(D.P.map(x=>[x.id,cn(x)])),eq=Object.fromEntries(D.E.concat((typeof P!=="undefined"&&P.custom)||[]).map(x=>[x.id,cn(x)])),k=Object.fromEntries(M.streams.map(x=>[x.id,x]));
return `${M.site.sample?`<p class="msg">${T("این مدل نمونه‌ی آموزشی است و اعداد آن ساختگی‌اند، نه داده‌ی واقعی.","This is a training sample; its numbers are made up, not real data.")}</p>`:""}
<h3 style="margin:0">${esc(lang==="fa"?M.site.name_fa:M.site.name_en)}</h3><div class="g">${mtile(T("واحدها","Units"),M.units.length)}${mtile(T("گره‌ها","Nodes"),M.nodes.length)}${mtile(T("جریان‌ها","Streams"),M.streams.length)}${mtile(T("نقاط اندازه‌گیری","Meters"),M.meters.length)}${mtile(T("مقادیر","Readings"),M.readings.length)}</div>
<details open><summary>${T("گره‌ها","Nodes")}</summary>${mtbl([T("شناسه","ID"),T("نام","Name"),T("نوع","Kind"),T("واحد","Unit"),T("تجهیز","Equipment")],M.nodes.map(x=>[x.id,esc(x.name),x.kind,x.unit,esc(eq[x.eq]||x.eq||"")]))}</details>
<details open><summary>${T("جریان‌ها","Streams")}</summary>${mtbl([T("شناسه","ID"),T("از","From"),T("به","To"),T("نوع جریان","Stream type")],M.streams.map(x=>[x.id,esc(nm[x.from]||""),esc(nm[x.to]||""),esc(ty[x.type]||x.type)]))}</details>
<details><summary>${T("نقاط اندازه‌گیری","Meters")}</summary>${mtbl([T("شناسه","ID"),T("روی","On"),T("پارامتر","Parameter"),T("واحد","Unit"),T("دقت","Accuracy")],M.meters.map(x=>[x.id,esc(x.stream?x.stream+" ("+(nm[k[x.stream]&&k[x.stream].from]||"")+" → "+(nm[k[x.stream]&&k[x.stream].to]||"")+")":nm[x.node]||x.node),esc(pr[x.param]||x.param),esc(x.unit),x.acc==null?"":fm(x.acc*100)+"%"]))}</details>
<details open><summary>${T("پوشش داده","Data coverage")}</summary>${mtbl([T("نقطه","Meter"),T("گام","Step"),T("دوره‌ها","Periods"),T("معتبر","Valid"),T("دوره‌های بدون داده","Missing periods")],M.coverage.map(c=>[c.meter,c.g,c.n,c.ok,esc((c.miss||[]).slice(0,4).join("، "))]))}</details>`}
function model(){const T=mT,dl=(b,n,t)=>`<a class="b o" style="text-decoration:none" href="${mData(b)}" download="${n}">${t}</a>`;
return `<div class="card"><h2>${T("مدل مجتمع و ورود داده","Plant model and data import")}</h2><p>${T("فایل Excel یا CSV را انتخاب کنید تا واحدها، تجهیزات (از بانک)، جریان‌های بین آن‌ها، نقاط اندازه‌گیری و داده‌ی ماهانه، سالانه یا روزانه خوانده و اعتبارسنجی شوند. مدل فقط وقتی ذخیره می‌شود که خطا نداشته باشد. تاریخ‌ها می‌توانند شمسی یا میلادی باشند.","Choose Excel or CSV files to read and validate units, equipment (from the bank), the streams between them, meters and monthly, yearly or daily data. The model is saved only when there are no errors. Dates may be Jalali or Gregorian.")}</p>
<div class="row" style="justify-content:flex-start;align-items:center"><label class="b" style="cursor:pointer">${T("انتخاب فایل (Excel یا CSV)","Choose files (Excel or CSV)")}<input type="file" id="mf" multiple accept=".xlsx,.csv" style="display:none"></label>${dl(D.TPL.xlsx,"Auditra-DataTemplate.xlsx",T("الگوی Excel","Excel template"))}${dl(D.TPL.csv,"Auditra-CSV-Templates.zip",T("الگوهای CSV","CSV templates"))}${dl(D.TPL.sample,"Sample-TrainingPlant.xlsx",T("نمونه‌ی Excel","Sample Excel"))}<button class="b o" data-m="sample">${T("بارگذاری نمونه‌ی آموزشی","Load training sample")}</button>${MODEL?`<button class="b o" data-m="clear">${T("حذف مدل","Remove model")}</button>`:""}</div>
<details><summary>${T("ساختار برگه‌ها","Sheet layout")}</summary>${mtbl([T("برگه","Sheet"),T("ستون‌ها (الزامی با ستاره)","Columns (required marked *)")],Object.entries(SP).map(([k,v])=>[k,esc(v.c.map(c=>c+(v.r.includes(c)?"*":"")).join(", "))]))}<p>${T("سطرهای شروع‌شده با # توضیح‌اند. مقدار خالی یعنی داده‌ی گمشده.","Rows starting with # are comments. An empty value means missing data.")}</p></details>
${MR?mres(MR):""}${MODEL?mview(MODEL):""}</div>`}
function saveM(){if(MR&&MR.e===0){MODEL=MR.M;try{localStorage.setItem("au_model",JSON.stringify(MODEL))}catch(x){MR.iss.push({s:"W",sh:"",row:0,fa:"مدل در حافظه‌ی مرورگر جا نشد و فقط در همین جلسه می‌ماند",en:"The model did not fit in browser storage and is kept for this session only"});MR.w++}}}
document.addEventListener("click",e=>{const b=e.target.closest("[data-m]");if(!b)return;const a=b.dataset.m;if(a==="sample"){MR=build(D.SAMPLE);MFl="";saveM()}else if(a==="clear"){MODEL=null;MR=null;localStorage.removeItem("au_model")}else if(a==="f")MFl=b.dataset.v;draw()});
document.addEventListener("change",async e=>{if(e.target.id!=="mf")return;MR=await ingest([...e.target.files]);MFl="";saveM();draw()});

draw();</script></body></html>
